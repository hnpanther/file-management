# Local development dependencies.
#
#   docker compose up -d
#
# The test suite does NOT use this - it starts its own throwaway PostgreSQL through Testcontainers
# (src/test/java/com/hnp/filemanagement/support/TestDatabases.java). This file is only for running
# the application itself against something persistent, on the port and with the account the
# default spring.datasource.* in application.properties expects.
#
# PostgreSQL since release C (2.1.0); MinIO joins it in Phase 4.
#
# Development only: the account below is the server's superuser. In production the application
# signs in as an account that owns its database and nothing else - docs/deployment.md,
# "Creating the database and its account".

services:
  postgres:
    image: postgres:18.4
    container_name: file-management-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: file_management
      POSTGRES_USER: file_management
      POSTGRES_PASSWORD: ${FILEMANAGEMENT_DB_PASSWORD:-file_management}
      # As production's database is created: UTF-8, and ICU's root locale - upper() folds all of
      # Unicode and names sort as MySQL's utf8mb4_unicode_ci did. V3.0 refuses a database whose
      # upper() folds only ASCII.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=und --locale=en_US.utf8"
    ports:
      # Loopback only: nothing but this machine reaches it.
      - "127.0.0.1:${FILEMANAGEMENT_DB_PORT:-5434}:5432"
    volumes:
      # PostgreSQL 18's image keeps its data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "file_management", "-d", "file_management"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
