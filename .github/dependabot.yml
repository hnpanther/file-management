version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns:
          - "org.springframework*"
      testing:
        patterns:
          - "org.testcontainers*"
          - "org.junit*"
          - "org.assertj*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
