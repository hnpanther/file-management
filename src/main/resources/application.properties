spring.profiles.active=prod

server.port=${FILEMANAGEMENT_PORT:8122}

# Behind a reverse proxy that terminates TLS (the intended deployment - see deployment.md), the
# proxy says what the client actually used in X-Forwarded-Proto / X-Forwarded-For / X-Forwarded-Host,
# and Tomcat honours those headers only from the proxy's own address range (loopback and private
# networks by default: server.tomcat.remoteip.internal-proxies). Without this the application
# believes every request is plain http: redirects after login point at http://, the session
# cookie is not marked Secure, and Spring Security never sends Strict-Transport-Security, which it
# does on its own once a request is known to be secure. `native` is Tomcat's RemoteIpValve; it
# changes nothing when no proxy header is present.
server.forward-headers-strategy=native


# Database
# ----------------------------------------------------------------------------------------------
# No credential belongs in this file. Supply them as environment variables, or drop a gitignored
# src/main/resources/application-local.properties (see application-local.properties.example) and
# run with spring.profiles.active=prod,local.
# FILEMANAGEMENT_DB_PASSWORD has no default on purpose: the application must fail loudly at
# startup rather than silently try a password that is public in the git history.
spring.datasource.url=${FILEMANAGEMENT_DB_URL:jdbc:postgresql://localhost:5434/file_management?sslmode=disable}
spring.datasource.username=${FILEMANAGEMENT_DB_USERNAME:file_management}
spring.datasource.password=${FILEMANAGEMENT_DB_PASSWORD:file_management}
# Room for two connections per upload in flight. An upload holds its own transaction open while
# the bytes are written, and takes a second connection for a moment to record the write in
# file_storage_write - in a transaction of its own, which is what makes the record survive a
# rollback (roadmap 2.3). With Hikari's default of ten, enough simultaneous uploads could each
# hold one and wait for the other; the wait ends in a connection timeout, not a corrupt file,
# but there is no reason to have it. Twenty idle MySQL connections cost nothing.
spring.datasource.hikari.maximum-pool-size=${FILEMANAGEMENT_DB_POOL_SIZE:20}

#jpa and hibernate
# validate, never update: Flyway owns the schema, and a mapping that disagrees with it must fail at
# startup rather than quietly alter a production table.
spring.jpa.hibernate.ddl-auto=validate
# Off, deliberately. Open-Session-In-View keeps a persistence context open for the whole request, so
# a lazy association touched while rendering a template silently issues a query from the view layer
# - the N+1 nobody can see in the service code. With it off, anything a page needs must be fetched
# inside a @Transactional service method, which is where the fetch joins in the repositories come
# from. Turning it back on would hide the next regression rather than fix it.
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
# One directory of migrations per database, picked by the driver the JDBC URL names (roadmap 3.4,
# release B): mysql/ holds V1.0 to V2.19 and the Java V2_17, postgresql/ the V3.0 baseline. Flyway
# records a script by its file name, not its path, so a MySQL database migrated before the move
# validates unchanged (VendorMigrationLayoutTest). From here until release C a schema change is
# written twice, once in each directory.
spring.flyway.locations=classpath:db/migration/{vendor}


# Interface copy
# ----------------------------------------------------------------------------------------------
# Persian UI strings live in messages.properties beside this file, not inline in templates.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Storage
# ----------------------------------------------------------------------------------------------
# Must already exist. A trailing separator is optional - every path is resolved against this
# root, never concatenated with it (FilesystemBlobStore). The default writes inside the working
# tree, which is fine for a local run and wrong for anything else; set FILEMANAGEMENT_BASE_DIR
# in every real deployment.
file.management.base-dir=${FILEMANAGEMENT_BASE_DIR:./TempFiles/files/main/}
# The same value under this application's own prefix, where every other setting lives
# (FileManagementProperties, roadmap 2.1). The old spelling above is what an external
# application.properties may already set, so it stays and this follows it - set either.
filemanagement.base-dir=${file.management.base-dir}

# Directory for the rolling application log (see logback-spring.xml).
filemanagement.log.path=${FILEMANAGEMENT_LOG_PATH:./logs}

# Max file size.
spring.servlet.multipart.max-file-size=20MB
# Max request size.
spring.servlet.multipart.max-request-size=20MB

# default page size
filemanagement.default.page-size=30

# Folder-level access control
# ----------------------------------------------------------------------------------------------
# The second of the two authorization questions: not "may this user list folders" (that is the
# PermissionEnum on the endpoint) but "may this user see *this* folder". A grant is a row in
# role_folder or user_folder naming a folder, and it covers everything beneath that folder.
#
# Off by default, and deliberately so: turning it on before any grant has been made empties the
# file tree for every non-administrator at once, because access is closed until granted.
# Administrators are unaffected either way - the ADMIN role is unrestricted by definition and no
# grant rows are read for it.
#
# To turn it on: grant the folders first, on the role edit page (نقش‌ها و مجوزها -> a role ->
# دسترسی پوشه‌ها), check that each role reaches what it should, and only then set this to true.
#
# API keys are outside this switch: a key reaches the folders it was granted and nothing else,
# on v1 and v2 alike, whether this is true or false. The switch is about people and their roles.
filemanagement.folder-access.enabled=${FILEMANAGEMENT_FOLDER_ACCESS_ENABLED:true}

# How deep the folder tree may go below Home: 1 is a flat list of top-level folders. A limit for
# people, not for the code - a tree nobody can navigate is the failure mode of "any depth".
filemanagement.folders.max-depth=${FILEMANAGEMENT_FOLDERS_MAX_DEPTH:6}

# The most files one "delete this folder with everything in it" may remove (REST_DELETE_FOLDER_TREE).
# A tree above it is refused with the count; delete it in parts. Bounds one transaction and one
# pass over the disk - not a quota, a blast radius.
filemanagement.folders.max-delete-files=${FILEMANAGEMENT_FOLDERS_MAX_DELETE_FILES:1000}

# The quota a user's personal folder (Profiles/{username}) is created with, in megabytes; 0 means
# none. Changed per user afterwards on the user's page. The quota caps every revision of every
# file anywhere beneath the folder.
filemanagement.profiles.default-quota-mb=${FILEMANAGEMENT_PROFILES_DEFAULT_QUOTA_MB:0}

# Temporary share links (/share/{token}): how long one may live at most, in minutes - a longer
# request is clamped to this, silently - and how long one lives when the maker does not say.
# password: OPTIONAL lets the maker decide, REQUIRED refuses a link without one. A wrong password
# max-failed-attempts times locks the link for lock-minutes.
filemanagement.share-links.max-minutes=${FILEMANAGEMENT_SHARE_LINKS_MAX_MINUTES:1440}
filemanagement.share-links.default-minutes=${FILEMANAGEMENT_SHARE_LINKS_DEFAULT_MINUTES:60}
filemanagement.share-links.password=${FILEMANAGEMENT_SHARE_LINKS_PASSWORD:OPTIONAL}
filemanagement.share-links.max-failed-attempts=${FILEMANAGEMENT_SHARE_LINKS_MAX_FAILED_ATTEMPTS:5}
filemanagement.share-links.lock-minutes=${FILEMANAGEMENT_SHARE_LINKS_LOCK_MINUTES:15}

# Unfinished byte writes (roadmap 2.3). A write is recorded in file_storage_write before the bytes
# are written and the record removed when its transaction ends, so what is left there is what a
# killed process abandoned. Every sweep-every-minutes, records older than unfinished-after-minutes
# are settled against file_details: bytes a revision claims are kept, bytes nothing claims are
# removed. Set sweep-enabled=false to watch the records accumulate instead of acting on them.
filemanagement.storage.sweep-enabled=${FILEMANAGEMENT_STORAGE_SWEEP_ENABLED:true}
filemanagement.storage.sweep-every-minutes=${FILEMANAGEMENT_STORAGE_SWEEP_EVERY_MINUTES:15}
filemanagement.storage.unfinished-after-minutes=${FILEMANAGEMENT_STORAGE_UNFINISHED_AFTER_MINUTES:60}
# Checksums (1.8.0, issue 7). Every upload records the SHA-256 of what was stored. The revisions
# stored before 1.8.0 are read back once, in the background, after the application has started:
# a batch at a time, oldest first, and only those with no checksum yet - so a restart carries on
# where the last run stopped, and a revision whose bytes are missing is reported in the log and
# left without one. It reads every stored byte once; on a large store, turn it off and on again
# to choose when that happens.
filemanagement.storage.checksum-backfill-enabled=${FILEMANAGEMENT_STORAGE_CHECKSUM_BACKFILL_ENABLED:true}
filemanagement.storage.checksum-backfill-batch-size=${FILEMANAGEMENT_STORAGE_CHECKSUM_BACKFILL_BATCH_SIZE:50}


# Active Directory
# ----------------------------------------------------------------------------------------------
# Disabled by default. When enabled, set the domain and URL through the environment - do not
# commit an internal hostname or IP address here.
filemanagement.auth.ldap.activedirectory.enabled=${FILEMANAGEMENT_AD_ENABLED:false}
filemanagement.auth.ldap.activedirectory.domain=${FILEMANAGEMENT_AD_DOMAIN:}
# One server, or several separated by spaces or commas: tried in order until one connects.
filemanagement.auth.ldap.activedirectory.url=${FILEMANAGEMENT_AD_URL:}
# How long a login waits for a controller that does not answer before trying the next.
filemanagement.auth.ldap.activedirectory.connect-timeout-ms=${FILEMANAGEMENT_AD_CONNECT_TIMEOUT_MS:5000}
filemanagement.auth.ldap.activedirectory.read-timeout-ms=${FILEMANAGEMENT_AD_READ_TIMEOUT_MS:10000}
# For ldaps:// with self-signed or internally issued certificates: a PKCS12 holding the
# controllers' certificates (or their CA). Empty means the JVM's own trust.
filemanagement.auth.ldap.activedirectory.truststore=${FILEMANAGEMENT_AD_TRUSTSTORE:}
filemanagement.auth.ldap.activedirectory.truststore-password=${FILEMANAGEMENT_AD_TRUSTSTORE_PASSWORD:}
filemanagement.auth.ldap.activedirectory.truststore-type=${FILEMANAGEMENT_AD_TRUSTSTORE_TYPE:PKCS12}
# false only when the URL names something the certificates do not (a load-balancer or domain
# name) AND a truststore pins the controllers. Refused without the truststore.
filemanagement.auth.ldap.activedirectory.verify-hostname=${FILEMANAGEMENT_AD_VERIFY_HOSTNAME:true}
# false = accept any certificate and any name (what ldap3 does with ssl.CERT_NONE). Encrypted to
# whoever answers; a machine on the path reads every password. Logged as a warning at start-up.
filemanagement.auth.ldap.activedirectory.verify-certificate=${FILEMANAGEMENT_AD_VERIFY_CERTIFICATE:true}

# Worked example - do not enable by setting these here, use the environment:
#
#   FILEMANAGEMENT_AD_ENABLED=true
#   FILEMANAGEMENT_AD_DOMAIN=corp.example.com      the AD domain users log in against
#   FILEMANAGEMENT_AD_URL=ldaps://dc01.corp.example.com:636 ldaps://dc02.corp.example.com:636
#                                                  every controller, ldaps on 636; plain ldap://
#                                                  on 389 sends the password in the clear and is
#                                                  logged as a warning at start-up
#   FILEMANAGEMENT_AD_TRUSTSTORE=D:/MyApp/file-management/config/ad-truststore.p12
#   FILEMANAGEMENT_AD_TRUSTSTORE_PASSWORD=...        the controllers' certificates, exported once
#
# How authentication then behaves:
#   * ActiveDirectoryCustomAuthenticationProvider is tried first, DaoAuthenticationProvider second.
#   * The account must already exist in the `user` table; AD verifies the password, it does not
#     create users. Create the user first with a matching `username`.
#   * `user.login_type` decides which backend may accept that account:
#       0 = either, 1 = local database only, 2 = Active Directory only.
#   * A user authenticated by AD still gets permissions from their roles in this database.
#
# Leaving `enabled` false is safe: the provider bean is still constructed, which is why the two
# properties above default to empty rather than being absent.

# ---------------------------------------------------------------- health and info (roadmap 9.5)
# In a file of its own so that the test configuration can import the same one; see management.properties.
spring.config.import=classpath:management.properties,classpath:openapi.properties
