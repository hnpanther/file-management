# Health and info (roadmap 9.5, closing issue 41).
#
# This block lives in a file of its own because `src/test/resources/application.properties` shadows
# the main one entirely - two files with the same classpath name, and the test one wins - so a
# setting written only in the main file is silently absent from every test. Both import this, which
# is what makes the suite exercise the configuration that actually ships.
#
# Only these two endpoints are exposed. `env`, `beans`, `configprops`, `heapdump`, `loggers` and the
# rest are deliberately absent: they describe the inside of the process, and this application is
# reachable from an internal network where "not linked from anywhere" is not access control.
management.endpoints.web.exposure.include=health,info

# Groups the container and the load balancer probe separately:
#   /actuator/health/liveness   - the process is alive; restarting it would help
#   /actuator/health/readiness  - it can serve traffic, which here means the database answers
# Without this the two groups do not exist and both probes have to use the aggregate.
management.endpoint.health.probes.enabled=true

# The aggregate status still reflects the database - that is the whole point - but the reasons stay
# out of the response. `/actuator/health` is reachable without credentials so that a probe can use
# it (see the actuator chain in SecurityConfig), and "which component is down, and why" is the first
# thing that should not be readable by whoever can reach the port. Operators read the log.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# `info` answers with the version and build time from build-info.properties, which the
# spring-boot-maven-plugin writes into the jar - the answer to "which build is running?" after an
# upgrade. Unlike `health` it is not exposed by default, which is why it is named above.
# Nothing from the environment: that would name hosts, paths and whatever else happens to be set.
management.info.env.enabled=false
