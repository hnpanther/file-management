# OpenAPI 3 and Swagger UI for the machine-facing API (roadmap 9.6).
#
# In a file of its own for the same reason management.properties is: the test
# `application.properties` shadows the main one entirely - same classpath name, and the test copy
# wins - so a setting written only in the main file is silently absent from every test. Both import
# this, which is what makes the suite exercise the configuration that actually ships.

# Both halves can be switched off without a rebuild, which is what "enabled in production but
# controllable" means. Turning off `api-docs` also empties the UI, so the two are independent on
# purpose: a deployment can keep the document for its own tooling and drop the browser page.
springdoc.api-docs.enabled=${FILEMANAGEMENT_OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${FILEMANAGEMENT_SWAGGER_UI_ENABLED:true}

# Not the default /v3/api-docs. That path is one character away from /api/** and would land in the
# machine chain, which answers 401 with a Basic challenge rather than sending a browser to the login
# page - so the page would appear to be broken rather than protected.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Endpoints in the order they are declared rather than alphabetically: the object-store operations
# read as list, download, head, upload, delete, which is the order somebody learns them in.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# The "Try it out" button posts real requests against the running application. It stays on, because
# the document is behind a permission and the operations it can reach are the caller's own.
springdoc.swagger-ui.try-it-out-enabled=true
# One dropdown entry per group; without this the UI opens on a synthetic "default" that lists
# everything including the internal /resource/** endpoints the pages use.
springdoc.swagger-ui.disable-swagger-default-url=true
