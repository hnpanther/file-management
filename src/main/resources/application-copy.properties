# The data copy of the PostgreSQL cut-over (roadmap 3.5), selected by the command-line argument
# --spring.profiles.active=copy and nothing else (DatabaseCopyCommand). The source is the MySQL the
# service is configured for - spring.datasource.* as in application.properties - and the target is
# the PostgreSQL below. No credential belongs in this file: set the three variables in the shell
# that runs the command.
filemanagement.copy.target-url=${FILEMANAGEMENT_COPY_TARGET_URL:}
filemanagement.copy.target-username=${FILEMANAGEMENT_COPY_TARGET_USERNAME:}
filemanagement.copy.target-password=${FILEMANAGEMENT_COPY_TARGET_PASSWORD:}
