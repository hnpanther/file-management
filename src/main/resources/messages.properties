# Spring Boot picks this file up automatically (spring.messages.basename=messages) and reads it as
# UTF-8, so Persian is written literally rather than escaped. Templates reference a key with
# Thymeleaf's #{...} syntax; Java code resolves one through MessageSource.
#
# Keys are grouped by area: app.*, nav.*, login.*, error.*, action.*, field.*, message.*.
# Add the key here first, then reference it - never inline a new Persian literal in a template.

