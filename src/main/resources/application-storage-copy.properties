# The storage copy of roadmap 4.4 (StorageCopyCommand), selected by the command-line argument
# --spring.profiles.active=storage-copy and nothing else. It reads the same settings as the service:
# spring.datasource.* for the rows, filemanagement.base-dir for the directory and
# filemanagement.storage.s3.* (FILEMANAGEMENT_S3_*) for the bucket. What it is asked to do comes from
# the command line - see docs/deployment.md, "Moving the files to the object store":
#
#   --filemanagement.storage-copy.direction=to-s3 | to-filesystem    required, no default
#   --filemanagement.storage-copy.mode=copy | verify | prune          copy unless set
#   --filemanagement.storage-copy.threads=4                           revisions at once, 1 to 64
#   --filemanagement.storage-copy.deep-verify=false                   true reads every object back
#   --filemanagement.storage-copy.after-id=0                          start after this file_details id
#   --filemanagement.storage-copy.confirm=false                       prune deletes only with true
#   --filemanagement.storage-copy.max-prune=100                       prune refuses to delete more
#   --filemanagement.storage-copy.quiet-minutes=60                    prune keeps anything newer
#   --filemanagement.storage-copy.report-dir=                         the CSV report; the log directory unless set

# Its own log, never the running service's app_log.log - two processes rolling one file corrupt it.
filemanagement.log.path=${FILEMANAGEMENT_LOG_PATH:./logs}/storage-copy
logging.level.com.hnp.filemanagement=info
# Ctrl+C lets the revisions in hand finish and the summary be logged before logging stops.
logging.register-shutdown-hook=false
