<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<!--
  Shared head and script blocks.

  Every asset is served from static/vendor/ or static/css/ - files that live in the source tree.
  Nothing here depends on Maven resolving a WebJar at runtime: an IDE or CI with a partly
  populated ~/.m2 used to serve 404s for every asset, which reached the browser as
  "Unexpected token '<'" on an unstyled page. See docs/ui.md.

  Styling is Tailwind, compiled from src/main/frontend/app.css into static/css/app.css and
  committed, so the Maven build needs no Node. Behaviour is Alpine.js.

  jQuery and Select2 remain only for the page AJAX and dependent dropdowns that have not been
  converted to fetch + Alpine yet.
-->
<head>
    <th:block th:fragment="head-assets">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light">
        <meta name="_csrf" th:content="${_csrf} != null ? ${_csrf.token} : ''">
        <meta name="_csrf_header" th:content="${_csrf} != null ? ${_csrf.headerName} : ''">
        <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
        <link rel="stylesheet" th:href="@{/css/app.css}">
    </th:block>

    <th:block th:fragment="head-assets-select">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light">
        <meta name="_csrf" th:content="${_csrf} != null ? ${_csrf.token} : ''">
        <meta name="_csrf_header" th:content="${_csrf} != null ? ${_csrf.headerName} : ''">
        <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
        <link rel="stylesheet" th:href="@{/vendor/select2/select2.min.css}">
        <link rel="stylesheet" th:href="@{/css/app.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="scripts">
    <script th:src="@{/vendor/alpine/alpine.min.js}" defer></script>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

<th:block th:fragment="scripts-select">
    <script th:src="@{/vendor/alpine/alpine.min.js}" defer></script>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/select2/select2.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

<!--
  The rules table. One row per catalogued kind: a checkbox that allows it, and its limit in whole
  megabytes. On the role page the whole table follows a mode radio and is disabled while the
  role is governed by the system-wide policy: the Alpine scope that owns `mode` is the role
  page's, and on the settings page there is no such scope, so the binding is inert there.
-->
<table th:fragment="upload-rules(rows, allowedName, maxName, serverCapMb)" class="table upload-rules">
    <thead>
    <tr>
        <th class="w-12"><span class="sr-only" th:text="#{uploadPolicy.column.allowed}">مجاز</span></th>
        <th th:text="#{uploadPolicy.column.kind}">نوع فایل</th>
        <th th:text="#{uploadPolicy.column.mediaType}">نوع محتوا</th>
        <th th:text="#{uploadPolicy.column.max}">حداکثر حجم (مگابایت)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${rows}">
        <td>
            <input type="checkbox" th:id="|${allowedName}-${r.extension}|" th:checked="${r.allowed}"
                   th:name="${allowedName}" th:value="${r.extension}"
                   x-bind:disabled="typeof mode !== 'undefined' && mode !== 'OWN'">
        </td>
        <td>
            <label class="technical font-semibold" dir="ltr" th:for="|${allowedName}-${r.extension}|"
                   th:text="'.' + ${r.extension}">.pdf</label>
        </td>
        <td class="technical max-w-xs whitespace-normal break-all text-xs text-ink-500" dir="ltr" th:text="${r.mediaType}">application/pdf</td>
        <td>
            <input type="number" class="form-control technical w-28" dir="ltr" min="1" step="1"
                   th:max="${serverCapMb}" th:name="|${maxName}[${r.extension}]|" th:value="${r.maxMb}"
                   x-bind:disabled="typeof mode !== 'undefined' && mode !== 'OWN'">
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
