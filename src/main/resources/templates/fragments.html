<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<!--
  Shared head and script blocks.

  Every asset is served from static/vendor/ or static/css/ - files that live in the source tree.
  Nothing here depends on Maven resolving a WebJar at runtime: an IDE or CI with a partly
  populated ~/.m2 used to serve 404s for every asset, which reached the browser as
  "Unexpected token '<'" on an unstyled page. See docs/ui.md.

  Styling is Tailwind, compiled from src/main/frontend/app.css into static/css/app.css and
  committed, so the Maven build needs no Node. Behaviour is Alpine.js.

  jQuery and Select2 remain only for the page AJAX and dependent dropdowns that have not been
  converted to fetch + Alpine yet.
-->
<head>
    <th:block th:fragment="head-assets">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light">
        <meta name="_csrf" th:content="${_csrf} != null ? ${_csrf.token} : ''">
        <meta name="_csrf_header" th:content="${_csrf} != null ? ${_csrf.headerName} : ''">
        <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
        <link rel="stylesheet" th:href="@{/css/app.css}">
    </th:block>

    <th:block th:fragment="head-assets-select">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light">
        <meta name="_csrf" th:content="${_csrf} != null ? ${_csrf.token} : ''">
        <meta name="_csrf_header" th:content="${_csrf} != null ? ${_csrf.headerName} : ''">
        <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
        <link rel="stylesheet" th:href="@{/vendor/select2/select2.min.css}">
        <link rel="stylesheet" th:href="@{/css/app.css}">
    </th:block>
</head>
<body>
<th:block th:fragment="scripts">
    <script th:src="@{/vendor/alpine/alpine.min.js}" defer></script>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

<th:block th:fragment="scripts-select">
    <script th:src="@{/vendor/alpine/alpine.min.js}" defer></script>
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/select2/select2.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

<!--
  The folder chooser's markup; its behaviour is window.folderChooser in app.js. The enclosing
  element declares x-data="folderChooser({...})" and, if it wants the choice posted, renders the
  hidden input itself - so the same markup serves a form (the upload target) and a dialog (the
  explorer's move). Every label is a message key; the caller passes only rootTitle and copy.
-->
<div th:fragment="folder-chooser" class="folder-chooser">
    <nav class="folder-chooser-crumbs" th:aria-label="#{explorer.aria.breadcrumb}">
        <template x-for="(crumb, index) in crumbs" :key="crumb.id">
            <span class="flex items-center gap-1">
                <button type="button" class="folder-chooser-crumb" :class="{ 'is-current': index === crumbs.length - 1 }"
                        @click="open(crumb.id)" x-text="crumbTitle(crumb)"></button>
                <i class="bi bi-chevron-left text-[0.6rem] text-ink-400" aria-hidden="true"
                   x-show="index < crumbs.length - 1"></i>
            </span>
        </template>
    </nav>
    <div class="folder-chooser-list">
        <p class="folder-chooser-note" x-show="loading" x-cloak th:text="#{explorer.tree.loading}">در حال بارگذاری…</p>
        <p class="folder-chooser-note text-red-600" x-show="error" x-cloak x-text="error"></p>
        <p class="folder-chooser-note" x-show="!loading && !error && children.length === 0" x-cloak
           th:text="#{folderChooser.noSubfolders}">زیرپوشه‌ای ندارد.</p>
        <template x-for="child in children" :key="child.id">
            <button type="button" class="folder-chooser-item" @click="open(child.id)">
                <i class="bi text-ink-400" :class="child.folderCount > 0 ? 'bi-folder-fill' : 'bi-folder2'" aria-hidden="true"></i>
                <span class="min-w-0 truncate" x-text="child.title"></span>
                <span class="explorer-badge" x-show="child.folderCount + child.fileCount > 0"
                      x-text="child.folderCount + child.fileCount"></span>
            </button>
        </template>
    </div>
    <div class="folder-chooser-actions">
        <span class="folder-chooser-chosen" x-show="chosen" x-cloak>
            <i class="bi bi-check2-circle text-brand-600" aria-hidden="true"></i>
            <span th:text="#{folderChooser.chosen}">پوشهٔ انتخاب‌شده:</span>
            <strong x-text="chosen ? chosen.path : ''"></strong>
        </span>
        <span class="folder-chooser-note" x-show="!chosen && !loading" x-cloak
              th:text="#{folderChooser.chooseOne}">به پوشهٔ مقصد بروید.</span>
    </div>
</div>

<!--
  The rules table. One row per catalogued kind: a checkbox that allows it, and its limit in whole
  megabytes. On the role page the whole table follows a mode radio and is disabled while the
  role is governed by the system-wide policy: the Alpine scope that owns `mode` is the role
  page's, and on the settings page there is no such scope, so the binding is inert there.
-->
<table th:fragment="upload-rules(rows, allowedName, maxName, serverCapMb)" class="table upload-rules">
    <thead>
    <tr>
        <th class="w-12"><span class="sr-only" th:text="#{uploadPolicy.column.allowed}">مجاز</span></th>
        <th th:text="#{uploadPolicy.column.kind}">نوع فایل</th>
        <th th:text="#{uploadPolicy.column.mediaType}">نوع محتوا</th>
        <th th:text="#{uploadPolicy.column.max}">حداکثر حجم (مگابایت)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${rows}">
        <td>
            <input type="checkbox" th:id="|${allowedName}-${r.extension}|" th:checked="${r.allowed}"
                   th:name="${allowedName}" th:value="${r.extension}"
                   x-bind:disabled="typeof mode !== 'undefined' && mode !== 'OWN'">
        </td>
        <td>
            <label class="technical font-semibold" dir="ltr" th:for="|${allowedName}-${r.extension}|"
                   th:text="'.' + ${r.extension}">.pdf</label>
        </td>
        <td class="technical max-w-xs whitespace-normal break-all text-xs text-ink-500" dir="ltr" th:text="${r.mediaType}">application/pdf</td>
        <td>
            <input type="number" class="form-control technical w-28" dir="ltr" min="1" step="1"
                   th:max="${serverCapMb}" th:name="|${maxName}[${r.extension}]|" th:value="${r.maxMb}"
                   x-bind:disabled="typeof mode !== 'undefined' && mode !== 'OWN'">
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
