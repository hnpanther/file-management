<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>
    <title th:text="#{webhook.pageTitle}">وب‌هوک‌ها | سامانه مدیریت اسناد</title>
</head>
<!--
  A webhook's signing secret, the one time it is shown: rendered by the request that made the subscription or
  rotated its secret (WebhookController.create / rotateSecret), never reached by a link or a redirect. Nothing keeps
  it in a form a person can read again: what is stored is encrypted, and only the sender opens it.
-->
<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<main class="container-fluid app-content">
    <header class="page-header">
        <div class="page-kicker" th:text="#{uploadPolicy.kicker}">تنظیمات</div>
        <h1 th:text="${rotated} ? #{webhook.secret.rotatedTitle(${created.name()})} : #{webhook.secret.createdTitle(${created.name()})}">وب‌هوک ساخته شد</h1>
    </header>

    <section class="card mb-5">
        <div class="card-body">
            <div class="alert alert-warning mb-4" role="alert" th:text="#{webhook.secret.once}">
                این رمز فقط همین یک بار نمایش داده می‌شود.
            </div>
            <label for="signing-secret" class="font-semibold" th:text="#{webhook.secret.label}">رمز امضا</label>
            <div class="flex flex-wrap items-center gap-2" x-data="{ copied: false }">
                <input id="signing-secret" class="form-control technical" dir="ltr" readonly
                       th:value="${created.signingSecret()}" @focus="$el.select()">
                <button type="button" class="btn btn-outline-secondary btn-sm"
                        @click="navigator.clipboard.writeText(document.getElementById('signing-secret').value); copied = true">
                    <i class="bi bi-clipboard" aria-hidden="true"></i>
                    <span x-show="!copied" th:text="#{webhook.secret.copy}">کپی</span>
                    <span x-show="copied" x-cloak th:text="#{webhook.secret.copied}">کپی شد</span>
                </button>
            </div>
            <p class="form-text mt-3" th:text="#{webhook.secret.howToCheck}">
                گیرنده با این رمز امضای سرآیند X-FM-Signature را بررسی می‌کند.
            </p>
            <p th:if="${rotated}" class="form-text" th:text="#{webhook.secret.previousHonoured}">
                رمز قبلی تا یک ساعت دیگر هم امضا می‌شود.
            </p>
            <div class="form-actions mt-5">
                <a th:href="@{/settings/webhooks}" class="btn btn-primary" th:text="#{webhook.secret.done}">ذخیره کردم</a>
            </div>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>
</body>
</html>
