<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>
    <title th:text="#{role.create.pageTitle}">ایجاد نقش</title>
</head>
<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<!--
  Creating a role asks for its name only. A new role holds nothing; saving it opens its edit page
  (role/role-edit.html) on the permissions tab, which is where what it may do is chosen. To start
  from what another role already holds, copy that role instead (the roles list and the edit page).
-->
<main class="container-fluid app-content">
    <header class="page-header">
        <div class="page-kicker" th:text="#{role.form.kicker}">مدیریت دسترسی</div>
        <h1 th:text="#{role.create.heading}">ایجاد نقش جدید</h1>
        <p class="page-description" th:text="#{role.create.description}">
            نام نقش را وارد کنید؛ پس از ذخیره، مجوزها و دسترسی‌ها را تعیین می‌کنید.
        </p>
    </header>

    <section class="card mx-auto max-w-2xl" aria-labelledby="role-form-title">
        <div class="card-body">
            <h2 id="role-form-title" class="sr-only" th:text="#{role.create.heading}">ایجاد نقش جدید</h2>

            <form th:action="@{/roles}" method="post" id="roleForm" th:object="${role}">
                <div class="form-group">
                    <label for="roleName" th:text="#{field.roleTitle}">عنوان نقش</label>
                    <input id="roleName" th:field="*{roleName}" class="form-control technical" dir="ltr"
                           type="text" maxlength="100" required>
                    <p class="form-text" th:text="#{role.create.nameHint}">
                        یک نام یکتا، مثلاً DOCUMENT_EDITORS.
                    </p>
                </div>

                <div th:if="${showMessage && !valid}" class="alert alert-warning mt-5" role="alert"
                     id="warning_message" th:text="${message}"></div>

                <div class="form-actions">
                    <a th:href="@{/roles}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-right" aria-hidden="true"></i>
                        <span th:text="#{action.backToRoles}">بازگشت به فهرست نقش‌ها</span>
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2" aria-hidden="true"></i>
                        <span th:text="#{role.create.submit}">ایجاد و تعیین مجوزها</span>
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>
</body>
</html>
