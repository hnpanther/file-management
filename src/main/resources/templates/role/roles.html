<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>
    <title th:text="#{role.list.pageTitle}">لیست نقش ها</title>
</head>
<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<!--
  Every role, with the two fixed ones (ADMIN, USER - FixedRole) marked. "Copy" makes a new role
  from a row - its permissions, folder grants and own upload policy - and opens it; it is the way
  to a role that differs from a fixed one, since those cannot be edited.
-->
<main class="container-fluid app-content">
    <header class="page-header">
        <div class="page-kicker" th:text="#{role.form.kicker}">مدیریت دسترسی</div>
        <h1 th:text="#{field.roles}">نقش‌ها</h1>
        <p class="page-description" th:text="#{role.list.description}">
            نقش‌ها مجموعه‌ای از مجوزها، دسترسی پوشه‌ها و قوانین بارگذاری هستند.
        </p>
    </header>

    <div th:if="${copyMessage}" class="alert alert-warning" role="alert" id="copy_message" th:text="${copyMessage}"></div>

    <section class="card">
        <div class="card-body">
            <div class="mb-4" sec:authorize="hasAuthority('CREATE_ROLE_PAGE') || hasAuthority('ADMIN')">
                <a class="btn btn-primary" th:href="@{/roles/create}">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i>
                    <span th:text="#{role.createButton}">ایجاد نقش جدید</span>
                </a>
            </div>

            <div th:if="${#lists.isEmpty(roles)}" class="empty-state empty-state-panel" th:text="#{role.list.empty}">
                هنوز نقشی تعریف نشده است.
            </div>

            <div th:unless="${#lists.isEmpty(roles)}" class="table-responsive">
                <table class="table" id="roles-table">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{field.id}">شناسه</th>
                        <th scope="col" th:text="#{field.roleTitle}">عنوان نقش</th>
                        <th scope="col" th:text="#{field.actions}">عملیات</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${roles}" th:attr="data-role=${r.roleName}">
                        <td class="align-middle technical" th:text="${r.id}"></td>
                        <td class="align-middle">
                            <span class="technical" dir="ltr" th:text="${r.roleName}"></span>
                            <span th:if="${r.fixed}" class="badge badge-secondary" th:text="#{role.fixed.badge}">ثابت</span>
                        </td>
                        <td class="align-middle">
                            <div class="flex flex-wrap items-start gap-2" x-data="{ open: false }" @keydown.escape="open = false">
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/roles/{id}(id=${r.id})}"
                                   th:text="${r.fixed} ? #{action.view} : #{action.edit}">مشاهده</a>
                                <th:block sec:authorize="hasAuthority('COPY_ROLE') || hasAuthority('ADMIN')">
                                    <button type="button" class="btn btn-sm btn-outline-secondary" @click="open = !open"
                                            :aria-expanded="open" th:text="#{role.copy.short}">کپی</button>
                                    <form method="post" class="role-copy-inline" x-show="open" x-cloak
                                          th:action="@{/roles/{id}/copy(id=${r.id})}">
                                        <input type="hidden" name="from" value="list">
                                        <label class="sr-only" th:for="|copy-name-${r.id}|" th:text="#{role.copy.nameLabel}">نام نقش جدید</label>
                                        <input th:id="|copy-name-${r.id}|" name="newRoleName" class="form-control technical"
                                               dir="ltr" type="text" maxlength="100" required
                                               th:placeholder="#{role.copy.placeholder}">
                                        <button type="submit" class="btn btn-sm btn-primary" th:text="#{role.copy.submit}">ایجاد کپی</button>
                                    </form>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>
</body>
</html>
