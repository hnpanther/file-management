<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>
    <title th:if="${#strings.equals(pageType, 'create')}" th:text="#{user.create.pageTitle}">ایجاد کاربر جدید</title>
    <title th:if="${#strings.equals(pageType, 'update')}" th:text="#{user.edit.pageTitle}">ویرایش کاربر</title>
</head>
<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<main class="container-fluid app-content">
    <header class="page-header">
        <div class="page-kicker" th:text="#{user.form.kicker}">مدیریت کاربران</div>
        <h1 th:if="${#strings.equals(pageType, 'create')}" th:text="#{user.create.heading}">ایجاد کاربر جدید</h1>
        <h1 th:if="${#strings.equals(pageType, 'update')}" th:text="#{user.edit.heading}">ویرایش اطلاعات کاربر</h1>
        <p class="page-description" th:text="#{user.form.description}">اطلاعات کاربر را تکمیل کنید.</p>
    </header>

    <section class="card mx-auto max-w-4xl">
        <div class="card-body">
            <form th:action="@{${#strings.equals(pageType, 'create') ? '/users' : '/users/' + user.getId()}}"
                  method="post" id="userForm" th:object="${user}">
                <input th:field="*{id}" type="hidden">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="personelCode" th:text="#{field.personnelCode}">کد پرسنلی</label>
                        <input id="personelCode" th:field="*{personelCode}" class="form-control technical"
                               dir="ltr" type="text" inputmode="numeric" autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label for="username" th:text="#{field.username}">نام کاربری</label>
                        <input id="username" th:field="*{username}" class="form-control technical"
                               dir="ltr" type="text" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="firstName" th:text="#{field.firstName}">نام</label>
                        <input id="firstName" th:field="*{firstName}" class="form-control"
                               dir="rtl" type="text" autocomplete="given-name" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName" th:text="#{field.lastName}">نام خانوادگی</label>
                        <input id="lastName" th:field="*{lastName}" class="form-control"
                               dir="rtl" type="text" autocomplete="family-name" required>
                    </div>
                    <div class="form-group">
                        <label for="nationalCode" th:text="#{field.nationalCode}">کد ملی</label>
                        <input id="nationalCode" th:field="*{nationalCode}" class="form-control technical"
                               dir="ltr" type="text" inputmode="numeric" autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label for="phoneNumber" th:text="#{field.phone}">شماره تلفن همراه</label>
                        <input id="phoneNumber" th:field="*{phoneNumber}" class="form-control technical"
                               dir="ltr" type="tel" inputmode="tel" autocomplete="tel" required>
                    </div>
                    <div th:if="${#strings.equals(pageType, 'create')}" class="form-group md:col-span-2">
                        <label for="password" th:text="#{field.password}">رمز عبور</label>
                        <input id="password" th:field="*{password}" class="form-control technical"
                               dir="ltr" type="password" autocomplete="new-password" required>
                    </div>
                </div>

                <div th:if="${showMessage && valid}" class="alert alert-success" role="status"
                     id="success_message" th:text="#{message.saved}">اطلاعات ذخیره شد.</div>
                <div th:if="${showMessage && !valid}" class="alert alert-warning" role="alert"
                     id="warning_message" th:text="${message}"></div>

                <div class="form-actions">
                    <a th:if="${#strings.equals(pageType, 'update')}"
                       th:href="@{'/users/' + ${user.getId()}}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-right" aria-hidden="true"></i>
                        <span th:text="#{action.backToProfile}">بازگشت به پروفایل</span>
                    </a>
                    <a th:if="${#strings.equals(pageType, 'create')}"
                       th:href="@{/users}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-right" aria-hidden="true"></i>
                        <span th:text="#{action.backToUsers}">بازگشت به فهرست کاربران</span>
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2" aria-hidden="true"></i>
                        <span th:text="#{action.save}">ذخیره</span>
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>
</body>
</html>
