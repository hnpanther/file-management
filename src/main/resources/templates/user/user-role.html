<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>
    <title th:text="#{user.roles.pageTitle}">نقش‌های کاربر</title>
</head>
<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<main class="container-fluid app-content">
    <header class="page-header">
        <div class="page-kicker" th:text="#{user.roles.form.kicker}">مدیریت دسترسی</div>
        <h1 th:text="#{user.roles.heading}">مدیریت نقش‌های کاربر</h1>
        <p class="page-description" th:text="#{user.roles.form.description}">نقش‌های کاربر را انتخاب کنید.</p>
    </header>

    <section class="card mx-auto max-w-4xl">
        <div class="card-body">
            <form th:action="@{'/users/' + ${user.getId()} + '/roles'}"
                  method="post" id="roleForm" th:object="${user}">
                <input th:field="*{id}" type="hidden">

                <div class="form-group">
                    <label for="username" th:text="#{field.username}">نام کاربری</label>
                    <input id="username" th:field="*{username}" class="form-control technical"
                           dir="ltr" type="text" readonly>
                </div>

                <fieldset class="mt-6">
                    <legend class="mb-1 text-base font-semibold text-ink-900" th:text="#{field.roles}">نقش‌ها</legend>
                    <p class="form-section-hint" th:text="#{user.roles.form.description}">نقش‌های کاربر را انتخاب کنید.</p>

                    <div th:if="${#lists.isEmpty(roles)}" class="empty-state empty-state-panel"
                         th:text="#{user.roles.empty}">نقشی برای انتخاب وجود ندارد.</div>

                    <div th:unless="${#lists.isEmpty(roles)}" class="permission-grid">
                        <label th:each="r: ${roles}" class="permission-option">
                            <input th:checked="${r.isSelected()}" name="rolesIds"
                                   type="checkbox" th:value="${r.getId()}">
                            <span class="permission-copy">
                                <span class="permission-name technical" dir="ltr" th:text="${r.getRoleName()}"></span>
                            </span>
                        </label>
                    </div>
                </fieldset>

                <div th:if="${showMessage && valid}" class="alert alert-success mt-5" role="status"
                     id="success_message" th:text="#{message.saved}">اطلاعات ذخیره شد.</div>
                <div th:if="${showMessage && !valid}" class="alert alert-warning mt-5" role="alert"
                     id="warning_message" th:text="${message}"></div>

                <div class="form-actions">
                    <a th:href="@{'/users/' + ${user.getId()}}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-right" aria-hidden="true"></i>
                        <span th:text="#{action.backToProfile}">بازگشت به پروفایل</span>
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2" aria-hidden="true"></i>
                        <span th:text="#{action.save}">ذخیره</span>
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>
</body>
</html>
