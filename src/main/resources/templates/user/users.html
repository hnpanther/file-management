<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="#{user.list.pageTitle}">لیست کاربران</title>


    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>

</head>
<body>

<div th:replace="~{navbar.html :: navbar}"></div>





<div class="container-fluid">
    <div class="row flex-lg-nowrap">


        <div class="col">
            <div class="e-tabs mb-3 px-3">
                <ul class="nav nav-tabs">
                    <li class="nav-item"><a class="nav-link active" href="#" th:text="#{nav.access.users}">کاربران</a></li>
                </ul>
            </div>



            <div class="row flex-lg-nowrap">
                <div class="col mb-3">

                    <div class="e-panel card">
                        <div class="card-body">
                            <div class="card-title">
                                <a class="btn btn-success" type="button" th:href="@{/users/create}" th:text="#{user.createButton}">ایجاد
                                    کاربر جدید
                                </a>
                            </div>


                            <div class="e-table">
                                <div class="table-responsive table-lg mt-3">
                                    <table class="table table-bordered">
                                        <thead>
                                        <tr>
                                            <th class="max-width" th:text="#{field.id}">شناسه</th>
                                            <th class="max-width" th:text="#{field.personnelCode}">کد پرسنلی</th>
                                            <th class="max-width" th:text="#{field.username}">نام کاربری</th>
                                            <th class="max-width" th:text="#{field.fullName}">نام و نام خانوادگی</th>
                                            <th class="max-width" th:text="#{field.state}">وضعیت</th>
<!--                                            <th class="max-width" th:text="#{field.nationalCode}">National code</th>-->
<!--                                            <th class="max-width" th:text="#{field.phone}">Phone number</th>-->
                                            <th th:text="#{field.actions}">عملیات</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="u: ${users}">

                                            <td class="text-nowrap align-middle" th:text="${u.getId()}"></td>
                                            <td class="text-nowrap align-middle" th:text="${u.getPersonelCode()}"></td>
                                            <td class="text-nowrap align-middle" th:text="${u.getUsername()}"></td>
                                            <td class="text-nowrap align-middle" th:text="${u.getFirstName() + ' ' + u.getLastName()}"></td>
                                            <td class="text-nowrap align-middle">
                                                <span class="badge badge-secondary"
                                                      th:text="${u.getEnabled() == 1} ? #{state.enabled} : #{state.disabled}">فعال</span>
                                            </td>
<!--                                            <td class="text-nowrap align-middle" th:text="${u.getNationalCode()}"></td>-->
<!--                                            <td class="text-nowrap align-middle" th:text="${u.getPhoneNumber()}"></td>-->
                                            <td class="text-center align-middle">
                                                <div class="btn-group align-top">
                                                    <a class="btn btn-sm btn-outline-secondary badge" type="button"
                                                       th:href="@{'/users/' + ${u.getId}}" th:text="#{action.view}">مشاهده
                                                    </a>
                                                    <!--
                                                      Enabling and disabling from the list, so that a
                                                      person who signs in with a leaver's account can be
                                                      stopped without opening their page first. Same
                                                      endpoint and permission as the profile's button.
                                                    -->
                                                    <a sec:authorize="hasAuthority('REST_CHANGE_USER_ENABLED') || hasAuthority('ADMIN')"
                                                       class="btn btn-sm btn-outline-secondary badge" type="button"
                                                       th:attr="data-user-id=${u.getId()},data-enabled=${u.getEnabled()}"
                                                       onclick="changeUserEnabled(this.dataset.userId, this.dataset.enabled)"
                                                       th:text="${u.getEnabled() == 1} ? #{user.action.disable} : #{user.action.enable}">غیرفعال کردن
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>


                                        </tbody>
                                    </table>
                                </div>
                                <div class="d-flex justify-content-center">
                                    <ul class="pagination mt-3 mb-0">
                                        <li th:if="${pageNumber > 1}" class="page-item disabled"><a th:href="@{/users(page-number=${pageNumber-2}, page-size=${pageSize}, search=${search})}" th:text="#{action.previous}">قبلی</a></li>

                                        <li th:if="${pageNumber > 1}" class="page-item"><a th:text="${pageNumber-1}" th:href="@{/users(page-number=${pageNumber-2}, page-size=${pageSize}, search=${search})}" class="page-link"></a></li>

                                        <li class="page-item active"><a th:text="${pageNumber}" href="#" class="page-link"></a></li>

                                        <li th:if="${((pageSize * pageNumber) < totalNumber)}" class="page-item"><a th:text="${pageNumber+1}" th:href="@{/users(page-number=${pageNumber}, page-size=${pageSize}, search=${search})}" class="page-link"></a></li>
                                        <li th:if="${((pageSize * pageNumber) < totalNumber)}" class="page-item">...</a></li>
                                        <li th:if="${((pageSize * pageNumber) < totalNumber)}" class="page-item"><a th:href="@{/users(page-number=${pageNumber}, page-size=${pageSize}, search=${search})}" th:text="#{action.next}">بعدی</a></li>

                                    </ul>
                                </div>
                            </div>
                        </div>





                    </div>






                </div>

                <div class="list-search-panel col-12 mb-3">
                    <div class="card">
                        <div class="card-body">

                            <hr class="my-3">

                            <div>

                                <div class="form-group">
                                    <label th:text="#{field.searchLabel}">جستجو:</label>
                                    <div><input class="form-control" type="search" th:placeholder="#{placeholder.searchTerm}" th:value="${search}" id="search" autocomplete="off"></div>
                                </div>
<!--                                <div class="form-check">-->
<!--                                    <input class="form-check-input" type="radio" name="stateRadio" id="exampleRadios1" value="3" th:checked="${stateFilter==3}">-->
<!--                                    <label class="form-check-label" for="exampleRadios1">-->
<!--                                        All requests-->
<!--                                    </label>-->
<!--                                </div>-->
<!--                                <div class="form-check">-->
<!--                                    <input class="form-check-input" type="radio" name="stateRadio" id="exampleRadios2" value="0" th:checked="${stateFilter==0}">-->
<!--                                    <label class="form-check-label" for="exampleRadios2">-->
<!--                                        Saved-->
<!--                                    </label>-->
<!--                                </div>-->

                            </div>

                            <hr>
                            <div class="text-center px-xl-3">
                                <button class="btn btn-success btn-block" type="button" onclick="search()" th:text="#{action.search}">جستجو</button>
                            </div>
                            <hr>
                            <div class="text-center px-xl-3">
                                <button class="btn btn-outline-secondary btn-block" type="button" onclick="reload()" th:text="#{action.clearSearch}">پاک کردن جستجو</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>


    </div>
</div>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>

<script th:inline="javascript">

    function search() {

        // let pageNumber = [[${pageNumber}]];
        // let pageSize = [[${pageSize}]];
        // let oldSearch = /*[[${oldSearch}]]*/ '';


        let input;
        input = document.getElementById("search").value;
        // let params = (new URL(document.location)).searchParams;
        // let pageNumber = params.get("page-number");
        // let pageSize = params.get("page-size");
        // let search = params.get("search-filter");
        // let filterState = $('input[name="stateRadio"]:checked').val();

        let loc = window.location;
        let newUrl = loc.protocol + "//" + loc.host + loc.pathname+ "?";
        newUrl += "search=" + encodeURIComponent(input.trim());
        window.location = newUrl;
        // if (input !== "") {
        //     newUrl += "search=" + input;
        //     window.location = newUrl;
        // }


    }

    function reload() {
        let loc = window.location;
        window.location = loc.protocol + "//" + loc.host + loc.pathname;

    }

    /**
     * Enables or disables a user from the list. One PUT to the same endpoint the profile page
     * uses; the row is re-read by reloading, so the badge and the button always say what the
     * database says rather than what the page assumed.
     */
    function changeUserEnabled(userId, currentlyEnabled) {
        if (!confirm([[#{js.confirmStateChange}]])) {
            return;
        }
        const csrf = window.appCsrf();
        const headers = { "X-Requested-With": "XMLHttpRequest" };
        if (csrf.header) {
            headers[csrf.header] = csrf.token;
        }
        headers["Content-Type"] = "application/json; charset=utf-8";
        fetch([[@{/resource/users/}]] + encodeURIComponent(userId) + "/change-enabled", {
            method: "PUT",
            headers: headers,
            body: JSON.stringify({ enabled: Number(currentlyEnabled) === 1 ? 0 : 1 })
        }).then(function (response) {
            if (response.status === 401) {
                window.appSessionExpired();
                return;
            }
            if (!response.ok) {
                alert([[#{form.unexpected}]]);
                return;
            }
            window.location.reload();
        }).catch(function () {
            alert([[#{form.unexpected}]]);
        });
    }

</script>

</body>
