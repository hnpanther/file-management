<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="#{user.profile.pageTitle}">پروفایل</title>

    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>

</head>


<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<div class="container">
    <div class="main-body">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="main-breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item active" aria-current="page" th:text="#{user.profile.heading}">پروفایل کاربری</li>
            </ol>
        </nav>
        <!-- /Breadcrumb -->
        <input class="userId" type="hidden" th:value="${user.getId()}">
        <input class="enabled" type="hidden" th:value="${user.getEnabled()}">

        <div class="row gutters-sm">
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex flex-column align-items-center text-center">

                            <div class="mt-3">
                                <h4 th:text="${user.getUsername()}"></h4>
                                <p class="text-secondary mb-1" th:text="${user.getEnabled() == 1} ? #{user.state.enabled} : #{user.state.disabled}"></p>
<!--                                <p class="text-muted font-size-sm">state</p>-->
                                <button sec:authorize="hasAuthority('REST_CHANGE_USER_ENABLED') || hasAuthority('ADMIN')" onclick="changeState()" class="btn btn-primary" th:text="${user.getEnabled() == 1} ? #{user.action.disable} : #{user.action.enable}"></button>


                                <th:block th:if="${user.getLoginType() == 0}">
                                    <p class="text-secondary mb-1" th:text="#{user.loginTypeLabel(#{user.loginType.any})}">نوع ورود: بدون محدودیت</p>
                                </th:block>
                                <th:block th:if="${user.getLoginType() == 1}">
                                    <p class="text-secondary mb-1" th:text="#{user.loginTypeLabel(#{user.loginType.local})}">نوع ورود: فقط احراز هویت داخلی</p>
                                </th:block>
                                <th:block th:if="${user.getLoginType() == 2}">
                                    <p class="text-secondary mb-1"><span th:text="#{user.loginTypeLabel('')}">نوع ورود: فقط</span> <span class="technical" dir="ltr">Active Directory</span></p>
                                </th:block>

                                <div class="relative inline-block" x-data="{ open: false }"
                                     @click.outside="open = false" @keydown.escape="open = false"
                                     sec:authorize="hasAuthority('REST_CHANGE_USER_LOGIN_TYPE') || hasAuthority('ADMIN')">
                                    <button class="btn btn-secondary" type="button"
                                            @click="open = !open" :aria-expanded="open">
                                        <span th:text="#{user.changeLoginType}">تغییر نوع ورود</span>
                                        <i class="bi bi-chevron-down text-[0.7rem] opacity-70" aria-hidden="true"></i>
                                    </button>
                                    <div x-show="open" x-cloak x-transition.opacity.duration.120ms
                                         class="absolute start-0 z-30 mt-1.5 w-60 overflow-hidden rounded-[var(--radius-card)]
                                                border border-ink-200 bg-white p-1 shadow-[var(--shadow-pop)]">
                                        <button class="flex w-full items-center rounded-[var(--radius-control)] px-2.5 py-2 text-start text-sm text-ink-700 hover:bg-ink-50"
                                                type="button" @click="open = false; changeLoginType(0)" th:text="#{user.loginType.any}">بدون محدودیت</button>
                                        <button class="flex w-full items-center rounded-[var(--radius-control)] px-2.5 py-2 text-start text-sm text-ink-700 hover:bg-ink-50"
                                                type="button" @click="open = false; changeLoginType(1)" th:text="#{user.loginType.local}">فقط احراز هویت داخلی</button>
                                        <button class="flex w-full items-center gap-1 rounded-[var(--radius-control)] px-2.5 py-2 text-start text-sm text-ink-700 hover:bg-ink-50"
                                                type="button" @click="open = false; changeLoginType(2)">
                                            <span th:text="#{user.loginTypeOnly}">فقط</span>
                                            <span class="technical" dir="ltr">Active Directory</span>
                                        </button>
                                    </div>
                                </div>




                            </div>
                        </div>
                    </div>
                </div>
                <div sec:authorize="hasAuthority('USER_ROLE_PAGE') || hasAuthority('ADMIN')" class="card mt-3">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap">
                            <h6 th:text="#{field.roles}">نقش ها</h6>
                            <span class="text-secondary"><a th:href="@{'/users/' + ${user.getId()} + '/roles' }" class="btn btn-success"> <i class="fa fa-arrow-circle-o-left"></i>نقش های کاربر</a></span>
                        </li>

                    </ul>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-sm-3">
                                <h6 class="mb-0" th:text="#{field.personnelCode}">کد پرسنلی</h6>
                            </div>
                            <div class="col-sm-9 text-secondary" th:text="${user.getPersonelCode()}"></div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-sm-3">
                                <h6 class="mb-0" th:text="#{field.username}">نام کاربری</h6>
                            </div>
                            <div class="col-sm-9 text-secondary" th:text="${user.getUsername()}"></div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-sm-3">
                                <h6 class="mb-0" th:text="#{field.fullName}">نام و نام خانوادگی</h6>
                            </div>
                            <div class="col-sm-9 text-secondary" th:text="${user.getFirstName() + ' ' + user.getLastName()}"></div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-sm-3">
                                <h6 class="mb-0" th:text="#{field.phone}">شماره تلفن همراه</h6>
                            </div>
                            <div class="col-sm-9 text-secondary" th:text="${user.getPhoneNumber()}"></div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-sm-3">
                                <h6 class="mb-0" th:text="#{user.otherInfo}">سایر اطلاعات</h6>
                            </div>
                            <div class="col-sm-9 text-secondary">

                            </div>
                        </div>
                        <hr>
                        <div sec:authorize="hasAuthority('UPDATE_USER_PAGE') || hasAuthority('ADMIN')" class="row">
                            <div class="col-sm-12">
                                <a class="btn btn-info " th:href="@{'/users/' + ${user.getId()} + '/edit'}" th:text="#{action.edit}">ویرایش</a>
                            </div>
                        </div>
                        <hr>
                        <div sec:authorize="hasAuthority('CHANGE_USER_PASSWORD_PAGE') || hasAuthority('ADMIN')" class="row">
                            <div class="col-sm-12">
                                <a class="btn btn-info " th:href="@{'/users/' + ${user.getId()} + '/change-password'}" th:text="#{user.changePassword}">تغییر رمز عبور</a>
                            </div>
                        </div>
                    </div>
                </div>


            </div>
        </div>

    </div>
</div>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>
<script th:inline="javascript">

    function changeState() {
        let newVal = $(".enabled").val();
        if(newVal == 1) {
            newVal = 0;
        } else {
            newVal = 1;
        }
        if(confirm([[#{js.confirmStateChange}]])) {
            let token = $("meta[name='_csrf']").attr("content");
            let headerToken = $("meta[name='_csrf_header']").attr("content");
            let contextPath = [[@{/}]];
            $.ajax({
                url: contextPath + "resource/users/" + $(".userId").val() + "/change-enabled",
                type: "PUT",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify({ enabled: newVal}),
                headers: {
                    'X-CSRF-TOKEN': token
                },
                complete: function (xhr, status) {
                    if(xhr.status === 200) {
                        alert([[#{js.stateChanged}]]);
                        let currentLocation = window.location;
                        let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "users/" + $(".userId").val();
                        window.location.replace(newUrl);
                    } else {
                        alert(xhr.responseText);
                    }
                }
            });
        }
    }


    function changeLoginType(i) {
        if(confirm([[#{js.confirmLoginTypeChange}]])) {
            let token = $("meta[name='_csrf']").attr("content");
            let headerToken = $("meta[name='_csrf_header']").attr("content");
            let contextPath = [[@{/}]];
            $.ajax({
                url: contextPath + "resource/users/" + $(".userId").val() + "/change-login-type/" + i,
                type: "PUT",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                headers: {
                    'X-CSRF-TOKEN': token
                },
                complete: function (xhr, status) {
                    if(xhr.status === 200) {
                        alert([[#{js.loginTypeChanged}]]);
                        let currentLocation = window.location;
                        let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "users/" + $(".userId").val();
                        window.location.replace(newUrl);
                    } else {
                        alert([[#{js.cannotChangeLoginType}]]);
                    }
                }
            });
        }
    }

</script>

</body>
