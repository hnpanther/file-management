<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <th:block th:replace="~{fragments.html :: head-assets-select}"></th:block>
    <title th:if="${#strings.equals(pageType, 'create')}" th:text="#{subCategory.create.pageTitle}">ساخت زیردسته‌بندی</title>
    <title th:if="${#strings.equals(pageType, 'update')}" th:text="#{subCategory.edit.heading}">ویرایش زیردسته‌بندی</title>
</head>
<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<main class="container-fluid app-content">
    <header class="page-header">
        <div class="page-kicker" th:text="#{subCategory.form.kicker}">ساختار فایل‌ها</div>
        <h1 th:if="${#strings.equals(pageType, 'create')}" th:text="#{subCategory.create.heading}">ایجاد زیردسته‌بندی جدید</h1>
        <h1 th:if="${#strings.equals(pageType, 'update')}" th:text="#{subCategory.edit.heading}">ویرایش زیردسته‌بندی</h1>
        <p class="page-description" th:text="#{subCategory.form.description}">اطلاعات زیردسته‌بندی را تکمیل کنید.</p>
    </header>

    <section class="card mx-auto max-w-4xl">
        <div class="card-body">
            <form th:action="@{${#strings.equals(pageType, 'create') ? '/file-sub-categories' : '/file-sub-categories/' + fileSubCategory.getId()}}"
                  method="post" id="subCategoryForm" th:object="${fileSubCategory}">
                <input class="subCategoryId" th:field="*{id}" type="hidden">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="subCategoryNameDescription" th:text="#{field.subCategoryNameFa}">نام زیردسته‌بندی فارسی</label>
                        <input id="subCategoryNameDescription" dir="rtl" type="text" class="form-control"
                               th:field="*{subCategoryNameDescription}" required>
                    </div>

                    <div class="form-group">
                        <label for="subCategoryName" th:text="#{subCategory.nameEnHint}">نام فنی انگلیسی</label>
                        <input id="subCategoryName" dir="ltr" type="text" class="form-control technical"
                               th:field="*{subCategoryName}" required
                               th:readonly="${#strings.equals(pageType, 'update')}">
                    </div>

                    <div class="form-group md:col-span-2">
                        <label for="fileCategoryId" th:text="#{select.category}">دسته‌بندی اصلی</label>
                        <select class="form-control fileCategoryId" name="fileCategoryId" id="fileCategoryId" required
                                th:disabled="${#strings.equals(pageType, 'update')}">
                            <option th:each="f: ${listCategory}" th:value="${f.getId()}"
                                    th:text="${f.getDisplayName()}"
                                    th:selected="${f.getId() == fileSubCategory.getFileCategoryId()}"></option>
                        </select>
                    </div>
                </div>

                <div th:if="${showMessage && valid}" class="alert alert-success" role="status"
                     id="success_message" th:text="${message}"></div>
                <div th:if="${showMessage && !valid}" class="alert alert-warning" role="alert"
                     id="warning_message" th:text="${message}"></div>

                <div class="form-actions form-actions-split">
                    <div class="form-action-group">
                        <a th:href="@{/file-sub-categories}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-right" aria-hidden="true"></i>
                            <span th:text="#{action.backToSubCategories}">بازگشت به فهرست زیردسته‌بندی‌ها</span>
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2" aria-hidden="true"></i>
                            <span th:text="#{action.save}">ذخیره</span>
                        </button>
                    </div>
                    <button th:if="${#strings.equals(pageType, 'update')}"
                            sec:authorize="hasAuthority('REST_DELETE_FILE_SUB_CATEGORY') || hasAuthority('ADMIN')"
                            type="button" onclick="deleteSubCategory()" class="btn btn-danger">
                        <i class="bi bi-trash3" aria-hidden="true"></i>
                        <span th:text="#{action.delete}">حذف</span>
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments.html :: scripts-select}"></th:block>
<script th:inline="javascript">
    $(function () {
        $("#fileCategoryId").select2({ width: "100%", dir: "rtl", placeholder: [[#{select.category}]] });
    });

    function deleteSubCategory() {
        if (!confirm([[#{js.confirmDelete}]])) {
            return;
        }
        const csrf = window.appCsrf();
        const headers = {};
        if (csrf.header && csrf.token) {
            headers[csrf.header] = csrf.token;
        }
        $.ajax({
            url: [[@{/resource/file-sub-categories/}]] + $(".subCategoryId").val(),
            type: "DELETE",
            dataType: "json",
            contentType: "application/json; charset=utf-8",
            headers: headers,
            complete: function (xhr) {
                if (xhr.status === 200) {
                    alert([[#{js.deleted}]]);
                    window.location.replace([[@{/file-sub-categories}]]);
                } else {
                    alert([[#{js.cannotDeleteMainTag}]]);
                }
            }
        });
    }
</script>
</body>
</html>
