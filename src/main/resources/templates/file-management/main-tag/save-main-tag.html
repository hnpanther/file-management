<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <th:block th:replace="~{fragments.html :: head-assets-select}"></th:block>
    <title th:if="${#strings.equals(pageType, 'create')}" th:text="#{tag.create.pageTitle}">ساخت برچسب</title>
    <title th:if="${#strings.equals(pageType, 'update')}" th:text="#{tag.edit.heading}">ویرایش برچسب</title>
</head>
<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<main class="container-fluid app-content">
    <header class="page-header">
        <div class="page-kicker" th:text="#{mainTag.form.kicker}">برچسب‌گذاری فایل‌ها</div>
        <h1 th:if="${#strings.equals(pageType, 'create')}" th:text="#{tag.createButton}">ایجاد برچسب جدید</h1>
        <h1 th:if="${#strings.equals(pageType, 'update')}" th:text="#{tag.edit.heading}">ویرایش برچسب</h1>
        <p class="page-description" th:text="#{mainTag.form.description}">اطلاعات برچسب را تکمیل کنید.</p>
    </header>

    <section class="card mx-auto max-w-4xl">
        <div class="card-body">
            <form th:action="@{${#strings.equals(pageType, 'create') ? '/main-tags' : '/main-tags/' + mainTag.getId()}}"
                  method="post" id="mainTagForm" th:object="${mainTag}">
                <input class="mainTagId" th:field="*{id}" type="hidden">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="tagNameDescription" th:text="#{field.tagNameFa}">نام فارسی برچسب</label>
                        <input id="tagNameDescription" dir="rtl" type="text" class="form-control"
                               th:field="*{tagNameDescription}" required>
                    </div>
                    <div class="form-group">
                        <label for="tagName" th:text="#{mainTag.nameEnHint}">نام فنی انگلیسی</label>
                        <input id="tagName" dir="ltr" type="text" class="form-control technical"
                               th:field="*{tagName}" required
                               th:readonly="${#strings.equals(pageType, 'update')}">
                    </div>
                    <div class="form-group">
                        <label for="fileCategoryId" th:text="#{select.category}">دسته‌بندی اصلی</label>
                        <select class="form-control fileCategoryId" name="fileCategoryId" id="fileCategoryId" required
                                th:disabled="${#strings.equals(pageType, 'update')}">
                            <option value=""></option>
                            <option th:each="f: ${listCategory}" th:value="${f.getId()}"
                                    th:text="${f.getDisplayName()}"
                                    th:selected="${f.getId() == mainTag.getFileCategoryId()}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fileSubCategoryId" th:text="#{select.subCategory}">زیردسته‌بندی</label>
                        <select class="form-control fileSubCategoryId" name="fileSubCategoryId"
                                id="fileSubCategoryId" required
                                th:disabled="${#strings.equals(pageType, 'update')}">
                            <option value=""></option>
                            <option th:if="${#strings.equals(pageType, 'update')}"
                                    th:value="${mainTag.getFileSubCategoryId()}"
                                    th:text="${mainTag.getFileSubCategoryNameDescription()}" selected></option>
                        </select>
                    </div>
                </div>

                <div th:if="${showMessage && valid}" class="alert alert-success" role="status"
                     id="success_message" th:text="${message}"></div>
                <div th:if="${showMessage && !valid}" class="alert alert-warning" role="alert"
                     id="warning_message" th:text="${message}"></div>

                <div class="form-actions form-actions-split">
                    <div class="form-action-group">
                        <a th:href="@{/main-tags}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-right" aria-hidden="true"></i>
                            <span th:text="#{action.backToMainTags}">بازگشت به فهرست برچسب‌ها</span>
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2" aria-hidden="true"></i>
                            <span th:text="#{action.save}">ذخیره</span>
                        </button>
                    </div>
                    <button th:if="${#strings.equals(pageType, 'update')}"
                            sec:authorize="hasAuthority('REST_DELETE_MAIN_TAG_FILE') || hasAuthority('ADMIN')"
                            type="button" onclick="deleteTag()" class="btn btn-danger">
                        <i class="bi bi-trash3" aria-hidden="true"></i>
                        <span th:text="#{action.delete}">حذف</span>
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments.html :: scripts-select}"></th:block>
<script th:inline="javascript">
    const MAIN_TAG_CREATE_MODE = [[${#strings.equals(pageType, 'create')}]];

    $(function () {
        const category = $("#fileCategoryId");
        const subCategory = $("#fileSubCategoryId");
        category.select2({ width: "100%", dir: "rtl", placeholder: [[#{select.category}]] });
        subCategory.select2({ width: "100%", dir: "rtl", placeholder: [[#{select.subCategory}]] });
        if (MAIN_TAG_CREATE_MODE) {
            category.val(null).trigger("change.select2");
            subCategory.val(null).trigger("change.select2");
        }
        category.on("change", function () {
            loadSubCategories(category.val(), subCategory);
        });
    });

    function loadSubCategories(categoryId, select) {
        select.empty().append(new Option("", "", true, true)).val(null).trigger("change.select2");
        if (!categoryId) {
            return;
        }
        $.ajax({
            type: "GET",
            url: [[@{/resource/file-categories/}]] + categoryId + "/sub-categories",
            headers: { "X-Requested-With": "XMLHttpRequest" }
        }).then(function (data) {
            select.select2({
                width: "100%",
                dir: "rtl",
                placeholder: [[#{select.subCategory}]],
                data: data.results
            }).val(null).trigger("change.select2");
        });
    }

    function deleteTag() {
        if (!confirm([[#{js.confirmDelete}]])) {
            return;
        }
        const csrf = window.appCsrf();
        const headers = {};
        if (csrf.header && csrf.token) {
            headers[csrf.header] = csrf.token;
        }
        $.ajax({
            url: [[@{/resource/main-tags/}]] + $(".mainTagId").val(),
            type: "DELETE",
            dataType: "json",
            contentType: "application/json; charset=utf-8",
            headers: headers,
            complete: function (xhr) {
                if (xhr.status === 200) {
                    alert([[#{js.deleted}]]);
                    window.location.replace([[@{/main-tags}]]);
                } else {
                    alert([[#{js.cannotDeleteFile}]]);
                }
            }
        });
    }
</script>
</body>
</html>
