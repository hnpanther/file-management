<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="#{mainTag.list.pageTitle}">لیست تگ ها</title>

    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>

</head>
<body>

<div th:replace="~{navbar.html :: navbar}"></div>

<div class="container-fluid">
    <div class="row flex-lg-nowrap">


        <div class="col">
            <div class="e-tabs mb-3 px-3">
                <ul class="nav nav-tabs">
                    <li class="nav-item"><a class="nav-link active" href="#" th:text="#{mainTag.list.heading}">تگ ها</a></li>
                </ul>
            </div>

            <div class="row flex-lg-nowrap">
                <div class="col mb-3">

                    <div class="e-panel card">
                        <div class="card-body">
                            <div sec:authorize="hasAuthority('CREATE_MAIN_TAG_FILE_PAGE') || hasAuthority('ADMIN')" class="card-title">
                                <a class="btn btn-success" type="button" th:href="@{/main-tags/create}" th:text="#{tag.createButton}">ایجاد
                                    تگ جدید
                                </a>
                            </div>
                            <div class="e-table">
                                <div class="table-responsive table-lg mt-3">
                                    <table class="table table-bordered">
                                        <thead>
                                        <tr>
                                            <th class="max-width" th:text="#{field.id}">شناسه</th>
                                            <th class="max-width" th:text="#{field.tagNameEn}">عنوان تگ(انگلیسی)</th>
                                            <th class="max-width" th:text="#{field.tagNameFa2}">عنوان تگ(فارسی)</th>
                                            <th class="max-width" th:text="#{field.parentCategoryNameFa}">نام دسته بندی اصلی(فارسی)</th>
                                            <th class="max-width" th:text="#{field.parentCategoryNameEn}">نام دسته بندی اصلی(انگلیسی)</th>
                                            <th class="max-width" th:text="#{field.parentSubCategoryNameFa}">نام زیر دسته بندی اصلی(فارسی)</th>
                                            <th class="max-width" th:text="#{field.parentSubCategoryNameEn}">نام زیر دسته بندی اصلی(انگلیسی)</th>
                                            <th th:text="#{field.actions}">عملیات</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="tag: ${tags}">

                                            <td class="text-nowrap align-middle" th:text="${tag.getId()}"></td>
                                            <td class="text-nowrap align-middle" th:text="${tag.getTagName()}"></td>
                                            <td class="text-nowrap align-middle" th:text="${tag.getTagNameDescription()}"></td>
                                            <td class="text-nowrap align-middle" th:text="${tag.getFileCategoryDisplayName()}"></td>
                                            <td class="text-nowrap align-middle" th:text="${tag.getFileCategoryName()}"></td>
                                            <td class="text-nowrap align-middle" th:text="${tag.getFileSubCategoryNameDescription()}"></td>
                                            <td class="text-nowrap align-middle" th:text="${tag.getFileSubCategoryName()}"></td>
                                            <td class="text-center align-middle">
                                                <div class="btn-group align-top">
                                                    <a class="btn btn-sm btn-outline-secondary badge" type="button"
                                                       th:href="@{'/main-tags/' + ${tag.getId()}}" th:text="#{action.view}">مشاهده
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>


                                        </tbody>
                                    </table>
                                </div>
                                <ul class="pagination mt-3 mb-0">
                                    <li th:if="${pageNumber > 1}" class="page-item disabled"><a th:href="@{/main-tags(page-number=${pageNumber-2}, page-size=${pageSize}, search=${search})}" th:text="#{action.previous}">قبلی</a></li>

                                    <li th:if="${pageNumber > 1}" class="page-item"><a th:text="${pageNumber-1}" th:href="@{/main-tags(page-number=${pageNumber-2}, page-size=${pageSize}, search=${search})}" class="page-link"></a></li>

                                    <li class="page-item active"><a th:text="${pageNumber}" href="#" class="page-link"></a></li>

                                    <li th:if="${(pageNumber) < totalPages}" class="page-item"><a th:text="${pageNumber+1}" th:href="@{/main-tags(page-number=${pageNumber}, page-size=${pageSize}, search=${search})}" class="page-link"></a></li>
                                    <li th:if="${(pageNumber) < totalPages}" class="page-item">...</a></li>
                                    <li th:if="${(pageNumber) < totalPages}" class="page-item"><a th:href="@{/main-tags(page-number=${pageNumber}, page-size=${pageSize}, search=${search})}" th:text="#{action.next}">بعدی</a></li>

                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-2 mb-2">
                    <div class="card">
                        <div class="card-body">

                            <hr class="my-3">

                            <div>

                                <div class="form-group">
                                    <label th:text="#{field.searchLabel}">جستجو:</label>
                                    <div><input class="form-control w-100" type="search" th:placeholder="#{placeholder.searchTerm}" th:value="${search}" id="search" autocomplete="off"></div>
                                </div>
                                <!--                                <div class="form-check">-->
                                <!--                                    <input class="form-check-input" type="radio" name="stateRadio" id="exampleRadios1" value="3" th:checked="${stateFilter==3}">-->
                                <!--                                    <label class="form-check-label" for="exampleRadios1">-->
                                <!--                                        تمام درخواست-->
                                <!--                                    </label>-->
                                <!--                                </div>-->
                                <!--                                <div class="form-check">-->
                                <!--                                    <input class="form-check-input" type="radio" name="stateRadio" id="exampleRadios2" value="0" th:checked="${stateFilter==0}">-->
                                <!--                                    <label class="form-check-label" for="exampleRadios2">-->
                                <!--                                        ذخیره شده-->
                                <!--                                    </label>-->
                                <!--                                </div>-->

                            </div>

                            <hr>
                            <div class="text-center px-xl-3">
                                <button class="btn btn-success btn-block" type="button" onclick="search()" th:text="#{action.search}">جستجو</button>
                            </div>
                            <hr>
                            <div class="text-center px-xl-3">
                                <button class="btn btn-outline-secondary btn-block" type="button" onclick="reload()" th:text="#{action.clearSearch}">پاک کردن جستجو</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>



        </div>


    </div>
</div>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>

<script>

    function search() {

        // let pageNumber = [[${pageNumber}]];
        // let pageSize = [[${pageSize}]];
        // let oldSearch = /*[[${oldSearch}]]*/ '';


        let input;
        input = document.getElementById("search").value;
        // let params = (new URL(document.location)).searchParams;
        // let pageNumber = params.get("page-number");
        // let pageSize = params.get("page-size");
        // let search = params.get("search-filter");
        // let filterState = $('input[name="stateRadio"]:checked').val();

        let loc = window.location;
        let newUrl = loc.protocol + "//" + loc.host + loc.pathname+ "?";
        newUrl += "search=" + encodeURIComponent(input.trim());
        window.location = newUrl;
        // if (input !== "") {
        //     newUrl += "search=" + input;
        //     window.location = newUrl;
        // }


    }

    function reload() {
        let loc = window.location;
        window.location = loc.protocol + "//" + loc.host + loc.pathname;
    }

</script>

</body>
