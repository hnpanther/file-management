<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>
    <title th:text="#{trash.restore.pageTitle}">بازگرداندن از سطل زباله | سامانه مدیریت اسناد</title>
</head>
<!--
  Restoring one entry of the recycle bin elsewhere, or under another name (2.18.0): TrashController. Opened from
  the bin, or by a restore that could not go back as it was - with why, and what was chosen. A folder is chosen by
  the shared chooser; none chosen goes back where it was. A revision goes back to its own file only.
-->
<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<main class="container-fluid app-content">
    <header class="page-header">
        <div class="page-kicker" th:text="#{trash.kicker}">فایل‌ها</div>
        <h1 th:text="#{trash.restore.heading}">بازگرداندن از سطل زباله</h1>
    </header>

    <div th:if="${refused != null}" class="alert alert-warning mb-5" role="alert" id="warning_message" th:text="${refused}"></div>

    <section class="card">
        <div class="card-body">
            <dl class="grid gap-3 lg:grid-cols-2 mb-4">
                <div>
                    <dt th:text="#{trash.restore.what}">مورد</dt>
                    <dd>
                        <strong th:text="${entry.name()}">قرارداد</strong>
                        <span class="badge" th:text="#{'trash.kind.' + ${entry.kind().name()}}">فایل</span>
                    </dd>
                </div>
                <div>
                    <dt th:text="#{trash.restore.from}">از</dt>
                    <dd>
                        <span th:text="${entry.originTitle() == null or entry.originTitle().isEmpty() ? '/' : entry.originTitle()}">ERP</span>
                        <div th:unless="${entry.originAvailable()}" class="field-hint" th:text="#{trash.originGone}">پوشهٔ قبلی دیگر نیست</div>
                    </dd>
                </div>
            </dl>

            <form method="post" th:action="@{/files/trash/{id}/restore(id=${entry.id()})}" id="trash-restore-form">
                <p th:if="${entry.kind().name() == 'REVISION'}" class="field-hint" th:text="#{trash.restore.revisionHint}">فقط به فایل خودش</p>

                <div th:unless="${entry.kind().name() == 'REVISION'}" class="form-group destination-section"
                     th:attr="data-initial-id=${folderId}"
                     x-data="folderChooser({
                        url: $el.dataset.foldersUrl,
                        initialId: $el.dataset.initialId ? Number($el.dataset.initialId) : null,
                        initialPath: [],
                        rootTitle: $el.dataset.rootTitle,
                        selectRoot: false,
                        copy: { loadFailed: $el.dataset.loadFailed, more: $el.dataset.more }
                     })"
                     th:data-folders-url="@{/resource/folders/children}"
                     th:data-root-title="#{explorer.root}"
                     th:data-load-failed="#{explorer.loadFailed}"
                     th:data-more="#{explorer.tree.more}">
                    <label th:text="#{trash.restore.toFolder}">پوشهٔ مقصد</label>
                    <input type="hidden" name="folderId" :value="chosen ? chosen.id : ''">
                    <div th:replace="~{fragments.html :: folder-chooser}"></div>
                    <p class="form-text" th:text="#{trash.restore.toFolderHint}">اگر پوشه‌ای انتخاب نکنید، به جای قبلی برمی‌گردد.</p>
                </div>

                <div th:unless="${entry.kind().name() == 'REVISION'}" class="form-group">
                    <label for="name" th:text="#{trash.restore.name}">نام جدید</label>
                    <input id="name" name="name" type="text" class="form-control" maxlength="100" th:value="${newName}">
                    <p class="form-text" th:text="#{trash.restore.nameHint}">اختیاری</p>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
                        <span th:text="#{trash.restore.submit}">بازگرداندن</span>
                    </button>
                    <a th:href="@{/files/trash}" class="btn btn-outline-secondary" th:text="#{trash.restore.cancel}">بازگشت</a>
                </div>
            </form>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>
</body>
</html>
