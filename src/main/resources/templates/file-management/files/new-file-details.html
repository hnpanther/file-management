<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:if="${#strings.equals(pageType, 'format')}" th:text="#{fileDetails.createFormat}">ایجاد فرمت جدید</title>
    <title th:if="${#strings.equals(pageType, 'version')}" th:text="#{fileDetails.createVersion}">ایجاد نسخهٔ جدید</title>

    <th:block th:replace="~{fragments.html :: head-assets-select}"></th:block>

</head>
<body>

<div th:replace="~{navbar.html :: navbar}"></div>


<h2></h2>
<h2 th:if="${#strings.equals(pageType, 'format')}" class="text-center" dir="rtl" th:text="#{fileDetails.createFormat}">ایجاد فرمت جدید </h2>
<h2 th:if="${#strings.equals(pageType, 'version')}" class="text-center" th:text="#{fileDetails.createVersion}">ایجاد نسخهٔ جدید</h2>
<p class="text-center text-muted" th:text="#{fileDetails.sameNameHint}">نام فایل باید دقیقاً با فایل قبلی یکسان باشد.</p>
<div class="container">
    <form enctype="multipart/form-data" th:action="@{'/files/file-info/' + ${file.getFileId()} + '/file-details'}" method="post" id="fileForm" th:object="${file}">

        <input th:field="*{fileId}" type="hidden">
        <input name="type" type="hidden" th:value="*{type}">
        <input name="fileDetailsId" type="hidden" th:value="*{fileDetailsId}">




        <div class="form-row">


            <div class="form-group col-md-6">
                <label th:text="#{field.description}">توضیحات</label>
                <input dir="rtl" type="text" class="form-control" th:field="*{fileDetailsDescription}" required>
            </div>

            <div class="form-group col-md-6">
                <label th:text="#{field.fileTitle}">عنوان فایل</label>
                <input dir="rtl" type="text" class="form-control" th:field="*{fileName}" readonly>
            </div>

            <div class="form-group col-md-6" style="text-align: right">
                <label for="multipartFile" th:text="#{field.chooseFile}">فایل موردنظر</label>
                <input type="file" class="form-control-file" name="multipartFile" id="multipartFile"
                       accept=".jpg,.xlsx,.docx,.pdf,.txt" required>
                <small class="form-text">فرمت‌های مجاز: <span class="technical" dir="ltr">JPG, PDF, TXT, XLSX, DOCX</span>؛ حداکثر حجم ۲۰ مگابایت.</small>
            </div>

            <div th:if="${#strings.equals(pageType, 'format')}" class="form-group col-md-6">
                <label th:text="#{field.version}">نسخه</label>
                <input name="version" dir="rtl" type="text" class="form-control" th:value="${lastVersion}" readonly>
            </div>

            <div th:if="${#strings.equals(pageType, 'version')}" class="form-group col-md-6">
                <label th:text="#{file.newVersion}">نسخهٔ جدید</label>
                <input name="version" dir="rtl" type="text" class="form-control" th:value="${lastVersion + 1}" readonly>
            </div>









        </div>


        <!-- Success message -->
        <div th:if="${showMessage && valid}" class="alert alert-success" role="alert" id="success_message"><i
                class="glyphicon glyphicon-thumbs-up" th:text="${message}"></i>
        </div>
        <div th:if="${showMessage && !valid}" class="alert alert-warning" role="alert" id="warning_message"
             th:text="${message}"><i class="glyphicon glyphicon-thumbs-up"></i>
        </div>

        <button type="submit" class="btn btn-primary" th:text="#{action.save}">ذخیره</button>
    </form>
    <hr>
    <a th:href="@{'/files/file-info/' + ${file.getFileId()}}" class="btn btn-success"> <i class="fa fa-arrow-circle-o-left"></i>برگشت</a>
</div>


<th:block th:replace="~{fragments.html :: scripts-select}"></th:block>
<script>



    $(document).ready(function () {



    })

    $('#fileForm').on('submit', function() {

    });


</script>


</body>
</html>
