<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="#{file.info.heading}">اطلاعات فایل</title>

    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>

</head>
<body>

<!-- start navbar -->
<div th:replace="~{navbar.html :: navbar}"></div>

<!-- end navbar -->

<div class="container">
    <div class="row flex-lg-nowrap">
        <input type="hidden" th:value="${file.getId()}" class="idInput" id="idInput" name="idInput">

        <div class="col">
            <div class="row">
                <div class="col mb-3">
                    <div class="card">
                        <div class="card-body">
                            <div class="e-profile">
                                <div class="row">

                                    <div class="col d-flex flex-column flex-sm-row justify-content-between mb-3">
                                        <div class="text-center text-sm-start mb-2 mb-sm-0">
                                            <h4 th:text="${file.getDescription()}"
                                                class="pt-sm-2 pb-1 mb-0 text-nowrap"></h4>
                                            <p th:text="${file.getFileName}" class="mb-0 technical"></p>

                                        </div>
                                        <div class="text-center text-sm-end">
                                            <span th:if="${file.getState() == 0}"
                                                  class="badge badge-secondary" th:text="#{state.public}">عمومی</span>
                                            <span th:if="${file.getState() != 0}" class="badge badge-secondary" th:text="#{state.private}">غیرعمومی</span>


                                            <div sec:authorize="hasAuthority('REST_CHANGE_FILE_INFO_STATE') || hasAuthority('ADMIN')" class="btn-group">
                                                <button onclick="changeState(0)" th:if="${file.getState() == -1}" type="button" class="btn btn-secondary btn-sm" aria-haspopup="true" aria-expanded="false" th:text="#{file.makePublic}">تغییر به عمومی</button>
                                                <button onclick="changeState(-1)" th:if="${file.getState() == 0}" type="button" class="btn btn-secondary btn-sm" aria-haspopup="true" aria-expanded="false" th:text="#{file.makePrivate}">تغییر به غیرعمومی</button>
                                            </div>


                                        </div>
                                    </div>
                                </div>
                                <ul class="nav nav-tabs">
                                    <li class="nav-item"><a href="#" class="active nav-link" th:text="#{file.info.heading}">اطلاعات فایل</a></li>
                                </ul>
                                <div class="tab-content pt-3">
                                    <div class="tab-pane active">
                                        <form class="form" novalidate="">
                                            <div class="row">
                                                <div class="col">
                                                    <div class="row">
                                                        <div class="col">
                                                            <div class="form-group">
                                                                <label th:text="#{field.fileTitle}">عنوان فایل</label>
                                                                <input th:value="${file.getFileName() }"
                                                                       class="form-control technical" type="text" name="fileName"
                                                                       disabled>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-group">
                                                                <label th:text="#{file.titleDescription}">توضیحات عنوان</label>
                                                                <input th:value="${file.getDescription() }"
                                                                       class="form-control description" type="text"
                                                                       name="description" id="description">
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div class="row">
                                                        <div class="col">
                                                            <div class="form-group">
                                                                <label th:text="#{field.createdAt}">تاریخ ایجاد</label>
                                                                <input th:value="${file.getCreatedAt()}"
                                                                       class="form-control change-date-input"
                                                                       type="text" name="cerate-date"
                                                                        disabled>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-group">
                                                                <label th:text="#{field.createdBy}">ایجاد کننده</label>
                                                                <input th:value="${file.getCreatedBy()}" class="form-control"
                                                                       type="text" name="size" disabled>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div class="row">
                                                        <div class="col">
                                                            <div class="form-group">
                                                                <label th:text="#{field.state}">وضعیت</label>
                                                                <input th:value="${file.getEnabled() == 1} ? #{state.enabled} : #{state.disabled}"
                                                                       class="form-control" type="text"
                                                                       name="format"
                                                                       disabled>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-group">
                                                                <label th:text="#{field.category2}">دسته بندی اصلی</label>
                                                                <input th:value="${file.getFileCategoryDisplayName()}"
                                                                       class="form-control version" type="text"
                                                                       disabled>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div class="row">
                                                        <div class="col">
                                                            <div class="form-group">
                                                                <label th:text="#{field.subCategory2}">دسته بندی فرعی</label>
                                                                <input th:value="${file.getFileSubCategoryNameDescription()}"
                                                                       class="form-control" type="text"
                                                                       name="format"
                                                                       disabled>
                                                            </div>
                                                        </div>
                                                        <div class="col">
                                                            <div class="form-group">
                                                                <label th:text="#{field.tag2}">تگ</label>
                                                                <input th:value="${file.getTagDescription()}"
                                                                       class="form-control version" type="text"
                                                                       disabled>
                                                            </div>
                                                        </div>
                                                    </div>


                                                </div>
                                            </div>


                                        </form>


                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-3 mb-3">
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="px-xl-3">
                                <button sec:authorize="hasAuthority('REST_DELETE_FILE_INFO') || hasAuthority('ADMIN')" class="btn btn-block btn-danger" onclick="deleteFileInfo()">
                                    <i class="fa fa-sign-out"></i>
                                    <span th:text="#{file.deleteCompletely}">حذف کامل فایل</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div sec:authorize="hasAuthority('REST_UPDATE_FILE_INFO_DESCRIPTION') || hasAuthority('ADMIN')" class="card-body">
                            <button onclick="updateFileInfoDescription()" type="button" class="btn btn-primary" th:text="#{file.saveDescription}">ذخیرهٔ توضیحات</button>

                        </div>
                        <div sec:authorize="hasAuthority('CREATE_FILE_PAGE') || hasAuthority('ADMIN')" class="card-body">
                            <a th:href="@{/files/create}" type="button"
                               class="btn btn-primary" th:text="#{file.createNew}">ایجاد فایل جدید</a>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>


<div class="container">
    <div class="row flex-lg-nowrap">


        <div class="col">
            <div class="e-tabs mb-3 px-3">
                <ul class="nav nav-tabs">
                    <li class="nav-item"><a class="nav-link active" href="#" th:text="#{file.versionsAndFormats}">نسخه‌ها و فرمت‌ها</a></li>
                </ul>
            </div>

            <div class="row flex-lg-nowrap">
                <div class="col mb-3">
                    <div class="e-panel card">
                        <div class="card-body">
                            <div class="card-title">
                                <h6><span th:text="#{file.versionsAndFormats}">نسخه‌ها و فرمت‌ها</span></h6>
                            </div>
                            <div class="e-table">
                                <div class="table-responsive table-lg mt-3">
                                    <table class="table table-bordered">
                                        <thead>
                                        <tr>

                                            <th class="max-width" th:text="#{field.id}">شناسه</th>
                                            <th class="max-width" th:text="#{field.fileName}">نام فایل</th>
                                            <th class="max-width" th:text="#{field.version}">نسخه</th>
                                            <th class="max-width" th:text="#{field.sizeKb}">حجم (کیلوبایت)</th>
<!--                                            <th class="max-width" th:text="#{field.state}">وضعیت</th>-->
                                            <th class="max-width" th:text="#{field.format}">فرمت</th>
                                            <th class="max-width" th:text="#{field.createdAt}">تاریخ ایجاد</th>
                                            <th class="max-width" th:text="#{field.createdBy}">ایجاد کننده</th>
                                            <th class="max-width" th:text="#{field.actions}">عملیات</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="fd: ${file.getFileDetailsDTOS()}">

                                            <td th:text="${fd.getId()}" class="text-nowrap align-middle"></td>
                                            <td th:text="${fd.getFileName()}" class="text-nowrap align-middle technical"></td>
                                            <td th:text="${fd.getVersion()}" class="text-nowrap align-middle"></td>
                                            <td th:text="${(fd.getFileSize() / 1024)}" class="text-nowrap align-middle"></td>
                                            <td th:text="${fd.getFileExtension()}" class="text-nowrap align-middle technical"></td>
                                            <td th:text="${fd.getCreatedAt()}" class="text-nowrap align-middle"></td>
                                            <td th:text="${fd.getCreatedBy()}" class="text-nowrap align-middle"></td>

                                            <td sec:authorize="hasAuthority('DOWNLOAD_FILE') || hasAuthority('ADMIN')" class="text-center align-middle">
                                                <div class="btn-group align-top">
                                                    <a sec:authorize="hasAuthority('DOWNLOAD_FILE') || hasAuthority('ADMIN')" th:href="@{'/files/file-info/' + ${file.getId()} + '/file-details/' + ${fd.getId() + '/download'} }"
                                                       class="btn btn-sm btn-outline-secondary badge" type="button" th:text="#{action.download}">دانلود</a>
                                                    <a sec:authorize="hasAuthority('REST_DELETE_FILE_DETAILS') || hasAuthority('ADMIN')" th:onclick="deleteFileDetails(/*[[${fd.getId()}]]*/, /*[[${file.getFileDetailsDTOS().size()}]]*/)"
                                                       class="btn btn-sm btn-outline-secondary badge" type="button" th:text="#{action.delete}">حذف</a>
                                                    <a sec:authorize="hasAuthority('SAVE_NEW_FILE_DETAILS_PAGE') || hasAuthority('ADMIN')" th:href="@{'/files/file-info/' + ${file.getId()} + '/file-details/create?type=format&id=' + ${fd.getId()} + '&version-number=' + ${fd.getVersion()}}"
                                                       class="btn btn-sm btn-outline-secondary badge" type="button" th:text="#{file.newFormat}">فرمت جدید</a>
                                                    <a sec:authorize="hasAuthority('SAVE_NEW_FILE_DETAILS_PAGE') || hasAuthority('ADMIN')" th:href="@{'/files/file-info/' + ${file.getId()} + '/file-details/create?type=version&id=' + ${fd.getId()} + '&version-number=' + ${fd.getVersion()}}"
                                                       class="btn btn-sm btn-outline-secondary badge" type="button" th:text="#{file.newVersion}">نسخهٔ جدید</a>

                                                    <a sec:authorize="hasAuthority('REST_CHANGE_STATE_FILE_DETAILS') || hasAuthority('ADMIN')"
                                                       class="btn btn-sm btn-outline-secondary badge" th:onclick="changeFileDetailsState(/*[[${fd.getId()}]]*/, /*[[${fd.getState}]]*/)" type="button" th:text="${fd.getState() == 0} ? #{state.public} : #{state.private}"></a>

                                                </div>
                                            </td>
                                        </tr>


                                        </tbody>
                                    </table>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
<!--                <div class="col-12 col-lg-3 mb-3">-->
<!--                    <div class="card">-->
<!--                        <div class="card-body">-->
<!--                            <div class="text-center px-xl-3">-->
<!--                                <a th:href="@{2222}"-->
<!--                                   class="btn btn-success btn-block" type="button">اضافه کردن</a>-->
<!--                            </div>-->
<!--                            <hr class="my-3">-->

<!--                        </div>-->
<!--                    </div>-->
<!--                </div>-->
            </div>


        </div>
    </div>
</div>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>

<script th:inline="javascript">

    function deleteFileInfo() {
        if(confirm([[#{js.confirmDeleteFile}]])) {
            let token = $("meta[name='_csrf']").attr("content");
            let headerToken = $("meta[name='_csrf_header']").attr("content");
            let contextPath = [[@{/}]];
            $.ajax({
                url: contextPath + "resource/files/file-info/" + $(".idInput").val(),
                type: "DELETE",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify({ name: 'value1', email: 'value2' }),
                headers: {
                    'X-CSRF-TOKEN': token
                },
                complete: function (xhr, status) {
                    if(xhr.status === 200) {
                        alert([[#{js.deleted}]]);
                        let currentLocation = window.location;
                        let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "files/file-info";
                        window.location.replace(newUrl);
                    } else {
                        alert(xhr.responseText);
                    }
                }
            });
        }
    }

    function updateFileInfoDescription() {
        let updatedDesc = $(".description").val();

        if(updatedDesc === null || updatedDesc === undefined || updatedDesc === '') {
            alert([[#{js.descriptionRequired}]])
        } else {
            if(confirm([[#{js.confirmDescriptionUpdate}]])) {
                let token = $("meta[name='_csrf']").attr("content");
                let headerToken = $("meta[name='_csrf_header']").attr("content");
                let contextPath = [[@{/}]];
                $.ajax({
                    url: contextPath + "resource/files/file-info/" + $(".idInput").val(),
                    type: "PUT",
                    dataType: "json",
                    contentType: "application/json; charset=utf-8",
                    data: JSON.stringify({ description: updatedDesc, email: 'value2' }),
                    headers: {
                        'X-CSRF-TOKEN': token
                    },
                    complete: function (xhr, status) {
                        if(xhr.status === 200) {
                            alert([[#{js.descriptionUpdated}]]);

                        } else {
                            alert(xhr.responseText);
                        }
                    }
                });
            }
        }


    }

    function changeState(i) {
        if(confirm([[#{js.confirmStateChange}]])) {
            let token = $("meta[name='_csrf']").attr("content");
            let headerToken = $("meta[name='_csrf_header']").attr("content");
            let contextPath = [[@{/}]];
            $.ajax({
                url: contextPath + "resource/files/file-info/" + $(".idInput").val() + "/change-state",
                type: "PUT",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify({ newState: i}),
                headers: {
                    'X-CSRF-TOKEN': token
                },
                complete: function (xhr, status) {
                    if(xhr.status === 200) {
                        alert([[#{js.stateChanged}]]);
                        let currentLocation = window.location;
                        let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "files/file-info/" + $(".idInput").val();
                        window.location.replace(newUrl);
                    } else {
                        alert(xhr.responseText);
                    }
                }
            });
        }
    }

    function deleteFileDetails(i, size) {
        // console.log("id=" + i + ", size=" + size);
        if(confirm([[#{js.confirmDeleteFileDetails}]])) {
            let token = $("meta[name='_csrf']").attr("content");
            let headerToken = $("meta[name='_csrf_header']").attr("content");
            let contextPath = [[@{/}]];
            $.ajax({
                url: contextPath + "resource/files/file-info/" + $(".idInput").val() + "/file-details/" + i,
                type: "DELETE",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify({ check: 'check'}),
                headers: {
                    'X-CSRF-TOKEN': token
                },
                complete: function (xhr, status) {
                    if(xhr.status === 200) {
                        alert([[#{js.deleted}]]);
                        if(size === 1) {
                            let currentLocation = window.location;
                            let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "files/file-info";
                            window.location.replace(newUrl);
                        } else if(size > 1) {
                            let currentLocation = window.location;
                            let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "files/file-info/" + $(".idInput").val();
                            window.location.replace(newUrl);
                        }

                    } else {
                        alert(xhr.responseText);
                    }
                }
            });
        } else {

        }
    }

    function changeFileDetailsState(fileDetailsId, currentState) {



        let newState = -1;
        if(currentState == -1) {
            newState = 0;
        } else {
            newState = -1;
        }

        if(confirm([[#{js.confirmStateChange}]])) {
            let token = $("meta[name='_csrf']").attr("content");
            let headerToken = $("meta[name='_csrf_header']").attr("content");
            let contextPath = [[@{/}]];

            $.ajax({
                url: contextPath + "resource/files/file-info/" + $(".idInput").val() + "/file-details/" + fileDetailsId + "/change-state/" + newState,
                type: "PUT",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify({ name: 'value1', email: 'value2' }),
                headers: {
                    'X-CSRF-TOKEN': token
                },
                complete: function (xhr, status) {
                    if(xhr.status === 200) {
                        alert([[#{js.stateChanged}]]);
                        let currentLocation = window.location;
                        let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "files/file-info/" + $(".idInput").val();
                        window.location.replace(newUrl);
                    } else {
                        alert(xhr.responseText);
                    }
                }
            });
        }

    }

</script>


</body>
</html>
