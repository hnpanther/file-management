<!DOCTYPE html>
<html lang="fa" dir="rtl" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>
    <title th:text="#{file.info.heading}"></title>
</head>
<body>
<div th:replace="~{navbar.html :: navbar}"></div>
<main class="container-fluid app-content workspace-page">
    <input type="hidden" th:value="${file.getId()}" class="idInput" id="idInput" name="idInput">
    <header class="page-header detail-header">
        <div class="min-w-0">
            <div class="page-kicker" th:text="#{file.info.heading}"></div>
            <h1 class="technical break-words" dir="auto" th:text="${file.getFileName()}"></h1>
            <p class="page-description break-words" th:text="${file.getDescription()}"></p>
        </div>
        <div class="flex flex-wrap gap-2">
            <a href="#revisions-title" class="btn btn-primary">
                <i class="bi bi-arrow-down-circle" aria-hidden="true"></i>
                <span th:text="#{ui.file.jumpToRevisions}"></span>
            </a>
            <a th:href="@{/files/file-info}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-right" aria-hidden="true"></i>
                <span th:text="#{action.backToFiles}"></span>
            </a>
        </div>
    </header>
    <div class="detail-layout">
        <section class="card min-w-0" aria-labelledby="file-metadata-title">
            <div class="card-body">
                <div class="section-heading">
                    <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
                    <h2 id="file-metadata-title" th:text="#{ui.file.metadata}"></h2>
                </div>
                <dl class="metadata-grid">
                    <div>
                        <dt th:text="#{field.fileTitle}"></dt>
                        <dd class="technical" dir="auto" th:text="${file.getFileName()}"></dd>
                    </div>
                    <div>
                        <dt th:text="#{field.state}"></dt>
                        <dd>
                            <span class="badge" th:classappend="${file.getEnabled() == 1} ? 'badge-success' : 'badge-danger'" th:text="${file.getEnabled() == 1} ? #{state.enabled} : #{state.disabled}"></span>
                        </dd>
                    </div>
                    <div>
                        <dt th:text="#{field.createdAt}"></dt>
                        <dd class="technical" dir="ltr" th:text="${@jalali.format(file.getCreatedAt())}"></dd>
                    </div>
                    <div>
                        <dt th:text="#{field.createdBy}"></dt>
                        <dd th:text="${file.getCreatedBy()}"></dd>
                    </div>
                    <div class="md:col-span-2">
                        <dt th:text="#{field.folder}"></dt>
                        <dd>
                            <div class="folder-path" th:if="${!#lists.isEmpty(file.getFolderPath())}">
                                <th:block th:each="crumb, it : ${file.getFolderPath()}">
                                    <a class="folder-path-link" th:href="@{/files/explorer(folder=${crumb.id()})}"
                                        th:text="${crumb.title()}"></a>
                                    <span class="folder-path-separator" th:unless="${it.last}" aria-hidden="true">/</span>
                                </th:block>
                            </div>
                        </dd>
                    </div>
                </dl>
                <div class="form-section">
                    <label class="block mb-2 text-sm font-medium" for="description" th:text="#{file.titleDescription}"></label>
                    <input th:value="${file.getDescription()}" class="form-control description" type="text" name="description" id="description">
                    <div class="flex flex-wrap gap-2 mt-3">
                        <button sec:authorize="hasAuthority('REST_UPDATE_FILE_INFO_DESCRIPTION') || hasAuthority('ADMIN')" onclick="updateFileInfoDescription()" type="button" class="btn btn-primary" th:text="#{file.saveDescription}"></button>
                    </div>
                </div>
            </div>
        </section>
        <aside class="flex flex-col gap-4 min-w-0">
            <section class="card">
                <div class="card-body">
                    <div class="section-heading">
                        <i class="bi bi-shield-check" aria-hidden="true"></i>
                        <div>
                            <h2 th:text="#{ui.file.visibility}"></h2>
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 mb-3">
                        <span class="badge" th:classappend="${file.getState() == 0} ? 'badge-success' : ''" th:text="${file.getState() == 0} ? #{state.public} : #{state.private}"></span>
                        <div sec:authorize="hasAuthority('REST_CHANGE_FILE_INFO_STATE') || hasAuthority('ADMIN')">
                            <button onclick="changeState(0)" th:if="${file.getState() == -1}" type="button" class="btn btn-secondary btn-sm" th:text="#{file.makePublic}"></button>
                            <button onclick="changeState(-1)" th:if="${file.getState() == 0}" type="button" class="btn btn-secondary btn-sm" th:text="#{file.makePrivate}"></button>
                        </div>
                    </div>
                    <p class="field-hint" th:text="#{file.upload.publicHint}"></p>
                </div>
            </section>
            <section class="card">
                <div class="card-body flex flex-col gap-3">
                    <a sec:authorize="hasAuthority('FILE_EXPLORER_PAGE') || hasAuthority('ADMIN')" th:href="@{/files/explorer(file=${file.getId()})}" class="btn btn-outline-secondary" id="show-in-explorer">
                        <i class="bi bi-folder2-open" aria-hidden="true"></i>
                        <span th:text="#{file.showInExplorer}"></span>
                    </a>
                    <a sec:authorize="hasAuthority('CREATE_FILE_PAGE') || hasAuthority('ADMIN')" th:href="@{/files/create}" class="btn btn-outline-secondary">
                        <i class="bi bi-plus-lg" aria-hidden="true"></i>
                        <span th:text="#{file.createNew}"></span>
                    </a>
                    <div sec:authorize="hasAuthority('REST_DELETE_FILE_INFO') || hasAuthority('ADMIN')" class="border-t border-ink-100 pt-3">
                        <button type="button" class="btn btn-danger-outline w-full" onclick="deleteFileInfo()">
                            <i class="bi bi-trash3" aria-hidden="true"></i>
                            <span th:text="#{file.deleteCompletely}"></span>
                        </button>
                    </div>
                </div>
            </section>
        </aside>
    </div>
    <section class="card mt-5" aria-labelledby="revisions-title">
        <div class="card-body">
            <div class="section-heading">
                <i class="bi bi-clock-history" aria-hidden="true"></i>
                <div>
                    <h2 id="revisions-title" th:text="#{file.versionsAndFormats}"></h2>
                    <p th:text="#{ui.file.revisionsHint}"></p>
                </div>
                <span class="badge ms-auto" th:text="${file.getFileDetailsDTOS().size()}"></span>
            </div>
            <div x-data="shareLinkPanel(SHARE_LINK)" @share-link.window="start($event.detail.id, $event.detail.label)" sec:authorize="hasAuthority('CREATE_SHARE_LINK') || hasAuthority('ADMIN')">
                <div th:replace="~{fragments.html :: share-link-panel}"></div>
            </div>
            <div class="revision-list">
                <article class="revision-card" th:each="fd: ${file.getFileDetailsDTOS()}">
                    <div class="revision-heading">
                        <span class="format-mark technical" dir="ltr" th:text="${fd.getFileExtension()}"></span>
                        <div class="min-w-0">
                            <h3 class="technical break-words" dir="auto" th:text="${fd.getFileName()}"></h3>
                            <div class="flex flex-wrap gap-2 mt-1 text-xs text-ink-500">
                                <span>
                                    <span th:text="#{field.version}"></span>
                                    <b th:text="${fd.getVersion()}"></b>
                                </span>
                                <span aria-hidden="true">·</span>
                                <span>
                                    <span th:text="#{field.id}"></span>
                                    <span th:text="${fd.getId()}"></span>
                                </span>
                            </div>
                        </div>
                    </div>
                    <dl class="revision-metadata">
                        <div>
                            <dt th:text="#{field.sizeKb}"></dt>
                            <dd class="technical" dir="ltr" th:text="${fd.getFileSize() / 1024}"></dd>
                        </div>
                        <div>
                            <dt th:text="#{field.createdAt}"></dt>
                            <dd class="technical" dir="ltr" th:text="${@jalali.format(fd.getCreatedAt())}"></dd>
                        </div>
                        <div>
                            <dt th:text="#{field.createdBy}"></dt>
                            <dd th:text="${fd.getCreatedBy()}"></dd>
                        </div>
                    </dl>
                    <div sec:authorize="hasAuthority('DOWNLOAD_FILE') || hasAuthority('ADMIN')">
                        <div class="revision-actions">
                            <a sec:authorize="hasAuthority('DOWNLOAD_FILE') || hasAuthority('ADMIN')" th:href="@{'/files/file-info/' + ${file.getId()} + '/file-details/' + ${fd.getId() + '/download'} }"
                                class="btn btn-sm btn-primary" th:text="#{action.download}">دانلود</a>
                            <a sec:authorize="hasAuthority('DOWNLOAD_FILE') || hasAuthority('ADMIN')" th:if="${fd.isPreviewable()}"
                                th:href="@{'/files/file-info/' + ${file.getId()} + '/file-details/' + ${fd.getId()} + '/download?inline=1'}" target="_blank" rel="noopener"
                                class="btn btn-sm btn-outline-secondary" type="button" th:text="#{action.preview}">پیش‌نمایش</a>
                            <button sec:authorize="hasAuthority('REST_DELETE_FILE_DETAILS') || hasAuthority('ADMIN')" th:onclick="deleteFileDetails(/*[[${fd.getId()}]]*/, /*[[${file.getFileDetailsDTOS().size()}]]*/)"
                                class="btn btn-sm btn-danger-outline" type="button" th:text="#{action.delete}">حذف</button>
                            <a sec:authorize="hasAuthority('SAVE_NEW_FILE_DETAILS_PAGE') || hasAuthority('ADMIN')" th:href="@{'/files/file-info/' + ${file.getId()} + '/file-details/create?type=format&id=' + ${fd.getId()} + '&version-number=' + ${fd.getVersion()}}"
                                class="btn btn-sm btn-outline-secondary" type="button" th:text="#{file.newFormat}">فرمت جدید</a>
                            <a sec:authorize="hasAuthority('SAVE_NEW_FILE_DETAILS_PAGE') || hasAuthority('ADMIN')" th:href="@{'/files/file-info/' + ${file.getId()} + '/file-details/create?type=version&id=' + ${fd.getId()} + '&version-number=' + ${fd.getVersion()}}"
                                class="btn btn-sm btn-outline-secondary" type="button" th:text="#{file.newVersion}">نسخهٔ جدید</a>
                            <button sec:authorize="hasAuthority('REST_CHANGE_STATE_FILE_DETAILS') || hasAuthority('ADMIN')"
                                class="btn btn-sm btn-outline-secondary" th:onclick="changeFileDetailsState(/*[[${fd.getId()}]]*/, /*[[${fd.getState}]]*/)" type="button" th:text="${fd.getState() == 0} ? #{state.public} : #{state.private}"></button>
                            <button sec:authorize="hasAuthority('CREATE_SHARE_LINK') || hasAuthority('ADMIN')"
                                class="btn btn-sm btn-outline-secondary" type="button"
                                th:attr="data-file-details-id=${fd.getId()},data-label=${fd.getFileName() + ' v' + fd.getVersion()}"
                                onclick="window.dispatchEvent(new CustomEvent('share-link', { detail: { id: Number(this.dataset.fileDetailsId), label: this.dataset.label } }))"
                                th:text="#{shareLink.button.short}">لینک موقت</button>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </section>
</main>
<th:block th:replace="~{fragments.html :: scripts}"></th:block>

<script th:inline="javascript">
    const SHARE_LINK = {
        createUrl:        /*[[@{/resource/files/file-details/{id}/share-links}]]*/ "/resource/files/file-details/{id}/share-links",
        maxMinutes:       /*[[${shareLinkRules.maxMinutes()}]]*/ 1440,
        defaultMinutes:   /*[[${shareLinkRules.defaultMinutes()}]]*/ 60,
        passwordRequired: /*[[${shareLinkRules.passwordRequired()}]]*/ false,
        copy: { failed: /*[[#{shareLink.failed}]]*/ "failed" }
    };

    function deleteFileInfo() {
        if(confirm([[#{js.confirmDeleteFile}]])) {
            let token = $("meta[name='_csrf']").attr("content");
            let headerToken = $("meta[name='_csrf_header']").attr("content");
            let contextPath = [[@{/}]];
            $.ajax({
                url: contextPath + "resource/files/file-info/" + $(".idInput").val(),
                type: "DELETE",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify({ name: 'value1', email: 'value2' }),
                headers: {
                    'X-CSRF-TOKEN': token
                },
                complete: function (xhr, status) {
                    if(xhr.status === 200) {
                        alert([[#{js.deleted}]]);
                        let currentLocation = window.location;
                        let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "files/file-info";
                        window.location.replace(newUrl);
                    } else {
                        alert(xhr.responseText);
                    }
                }
            });
        }
    }

    function updateFileInfoDescription() {
        let updatedDesc = $(".description").val();

        if(updatedDesc === null || updatedDesc === undefined || updatedDesc === '') {
            alert([[#{js.descriptionRequired}]])
        } else {
            if(confirm([[#{js.confirmDescriptionUpdate}]])) {
                let token = $("meta[name='_csrf']").attr("content");
                let headerToken = $("meta[name='_csrf_header']").attr("content");
                let contextPath = [[@{/}]];
                $.ajax({
                    url: contextPath + "resource/files/file-info/" + $(".idInput").val(),
                    type: "PUT",
                    dataType: "json",
                    contentType: "application/json; charset=utf-8",
                    data: JSON.stringify({ description: updatedDesc, email: 'value2' }),
                    headers: {
                        'X-CSRF-TOKEN': token
                    },
                    complete: function (xhr, status) {
                        if(xhr.status === 200) {
                            alert([[#{js.descriptionUpdated}]]);

                        } else {
                            alert(xhr.responseText);
                        }
                    }
                });
            }
        }


    }

    function changeState(i) {
        if(confirm([[#{js.confirmStateChange}]])) {
            let token = $("meta[name='_csrf']").attr("content");
            let headerToken = $("meta[name='_csrf_header']").attr("content");
            let contextPath = [[@{/}]];
            $.ajax({
                url: contextPath + "resource/files/file-info/" + $(".idInput").val() + "/change-state",
                type: "PUT",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify({ newState: i}),
                headers: {
                    'X-CSRF-TOKEN': token
                },
                complete: function (xhr, status) {
                    if(xhr.status === 200) {
                        alert([[#{js.stateChanged}]]);
                        let currentLocation = window.location;
                        let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "files/file-info/" + $(".idInput").val();
                        window.location.replace(newUrl);
                    } else {
                        alert(xhr.responseText);
                    }
                }
            });
        }
    }

    function deleteFileDetails(i, size) {
        // console.log("id=" + i + ", size=" + size);
        if(confirm([[#{js.confirmDeleteFileDetails}]])) {
            let token = $("meta[name='_csrf']").attr("content");
            let headerToken = $("meta[name='_csrf_header']").attr("content");
            let contextPath = [[@{/}]];
            $.ajax({
                url: contextPath + "resource/files/file-info/" + $(".idInput").val() + "/file-details/" + i,
                type: "DELETE",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify({ check: 'check'}),
                headers: {
                    'X-CSRF-TOKEN': token
                },
                complete: function (xhr, status) {
                    if(xhr.status === 200) {
                        alert([[#{js.deleted}]]);
                        if(size === 1) {
                            let currentLocation = window.location;
                            let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "files/file-info";
                            window.location.replace(newUrl);
                        } else if(size > 1) {
                            let currentLocation = window.location;
                            let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "files/file-info/" + $(".idInput").val();
                            window.location.replace(newUrl);
                        }

                    } else {
                        alert(xhr.responseText);
                    }
                }
            });
        } else {

        }
    }

    function changeFileDetailsState(fileDetailsId, currentState) {



        let newState = -1;
        if(currentState == -1) {
            newState = 0;
        } else {
            newState = -1;
        }

        if(confirm([[#{js.confirmStateChange}]])) {
            let token = $("meta[name='_csrf']").attr("content");
            let headerToken = $("meta[name='_csrf_header']").attr("content");
            let contextPath = [[@{/}]];

            $.ajax({
                url: contextPath + "resource/files/file-info/" + $(".idInput").val() + "/file-details/" + fileDetailsId + "/change-state/" + newState,
                type: "PUT",
                dataType: "json",
                contentType: "application/json; charset=utf-8",
                data: JSON.stringify({ name: 'value1', email: 'value2' }),
                headers: {
                    'X-CSRF-TOKEN': token
                },
                complete: function (xhr, status) {
                    if(xhr.status === 200) {
                        alert([[#{js.stateChanged}]]);
                        let currentLocation = window.location;
                        let newUrl = currentLocation.protocol + "//" + currentLocation.hostname + ":" + currentLocation.port + contextPath + "files/file-info/" + $(".idInput").val();
                        window.location.replace(newUrl);
                    } else {
                        alert(xhr.responseText);
                    }
                }
            });
        }

    }

</script>


</body>
</html>
