<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>
    <title th:text="#{tree.pageTitle}">درخت فایل‌ها | سامانه مدیریت اسناد</title>
</head>
<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<main class="container-fluid app-content">

    <header class="page-header">
        <div class="page-kicker" th:text="#{tree.kicker}">مرور ساختار</div>
        <h1 th:text="#{tree.heading}">درخت فایل‌ها</h1>
        <p class="page-description" th:text="#{tree.description}">
            ساختار دسته‌بندی‌ها، برچسب‌ها و نسخه‌های هر فایل را مرور کنید.
        </p>
    </header>

    <section class="card" aria-labelledby="tree-title">
        <div class="card-body">

            <div x-data="fileTree()">

                <div class="mb-4 flex flex-wrap items-center gap-2 border-b border-ink-100 pb-3">
                    <button type="button" class="btn btn-secondary btn-sm" @click="expandAll()" :disabled="loading">
                        <i class="bi bi-chevron-double-down" aria-hidden="true"></i>
                        <span th:text="#{tree.expandAll}">باز کردن همه</span>
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" @click="collapseAll()">
                        <i class="bi bi-chevron-double-up" aria-hidden="true"></i>
                        <span th:text="#{tree.collapseAll}">بستن همه</span>
                    </button>
                    <h2 id="tree-title" class="sr-only" th:text="#{tree.heading}">درخت فایل‌ها</h2>
                </div>

                <!--
                  A label alone does not tell two identically-named branches apart (issue 73 -
                  a folder can carry the exact name of an unrelated folder elsewhere in the same
                  top-level folder), so this finds a file by id or name and opens a path straight
                  to it instead of asking the user to guess which same-looking folder holds it.
                -->
                <form class="mb-4 flex flex-wrap items-start gap-2" @submit.prevent="runSearch()">
                    <input type="search" x-model="searchQuery" :placeholder="TREE.searchPlaceholder"
                           class="form-control min-w-64 flex-1" />
                    <button type="submit" class="btn btn-secondary btn-sm" :disabled="searching">
                        <i class="bi text-[0.9rem]" :class="searching ? 'bi-arrow-repeat animate-spin' : 'bi-search'"
                           aria-hidden="true"></i>
                        <span th:text="#{tree.searchButton}">جست‌وجو</span>
                    </button>
                </form>

                <p class="py-1 text-xs text-red-600" x-show="searchError" x-cloak x-text="searchError"></p>

                <div class="mb-4 rounded-[var(--radius-card)] border border-ink-200" x-show="searchResults.length > 0" x-cloak>
                    <p class="border-b border-ink-100 px-3 py-2 text-xs text-ink-500" th:text="#{tree.searchHint}">
                        ممکن است چند شاخه با نام یکسان وجود داشته باشد؛ مسیر کامل هر نتیجه پایین آن نوشته شده است.
                    </p>
                    <ul class="m-0 list-none p-0">
                        <template x-for="hit in searchResults" :key="hit.fileId">
                            <li class="border-b border-ink-100 px-3 py-2 last:border-0 hover:bg-ink-50">
                                <button type="button" class="w-full text-start" @click="revealHit(hit)">
                                    <span class="technical block" x-text="hit.fileName"></span>
                                    <span class="block text-xs text-ink-400"
                                          x-text="hit.folderTitles.join(' ◂ ')"></span>
                                </button>
                            </li>
                        </template>
                    </ul>
                </div>

                <p class="empty-state" x-show="rows.length === 0 && !loading" x-cloak
                   th:text="#{tree.empty}">هنوز دسته‌بندی‌ای ساخته نشده است.</p>

                <p class="py-2 text-xs text-red-600" x-show="error" x-cloak x-text="error"></p>

                <!--
                  The tree is held as a flat list of visible rows, each carrying its depth.
                  Opening a folder splices its children in after it; closing removes every
                  following row that is deeper. That keeps the markup to one loop, supports any
                  depth, and gives drag-and-drop a single ordered list to work against later.
                -->
                <ul class="app-tree" role="tree" :aria-busy="loading">
                    <template x-for="row in rows" :key="row.key">
                        <li role="treeitem" :id="'tree-row-' + row.key"
                            :aria-expanded="row.expandable ? (row.open ? 'true' : 'false') : null"
                            :aria-level="row.depth + 1">

                            <!-- The rest of a level, a page at a time (roadmap 12.4). -->
                            <button type="button" class="app-tree-row w-full text-brand-700" x-show="row.more" x-cloak
                                    :style="'padding-inline-start:' + (0.375 + row.depth * 1.15 + 1.4) + 'rem'"
                                    :disabled="row.loading" @click="loadMore(row)">
                                <i class="bi text-[0.7rem]" :class="row.loading ? 'bi-arrow-repeat animate-spin' : 'bi-three-dots'" aria-hidden="true"></i>
                                <span x-text="TREE.more.replace('{0}', (row.total - row.shown).toLocaleString('fa-IR'))"></span>
                            </button>
                            <div class="app-tree-row" x-show="!row.more" :class="[row.open && 'bg-ink-50', row.key === highlightKey && 'app-tree-row-highlight']"
                                 :style="'padding-inline-start:' + (0.375 + row.depth * 1.15) + 'rem'">

                                <button type="button" class="app-tree-twisty"
                                        :class="!row.expandable && 'is-leaf'"
                                        :disabled="!row.expandable || row.loading"
                                        :aria-label="row.open ? TREE.collapse : TREE.expand"
                                        @click="toggle(row)">
                                    <i class="bi text-[0.7rem]"
                                       :class="row.loading ? 'bi-arrow-repeat animate-spin' : 'bi-chevron-left'"
                                       aria-hidden="true"></i>
                                </button>

                                <i class="app-tree-icon bi" :class="row.icon" aria-hidden="true"></i>

                                <span class="app-tree-label">
                                    <span class="technical" x-text="row.name"></span>
                                    <span class="text-ink-400" x-show="row.title && row.title !== row.name">
                                        &nbsp;—&nbsp;<span x-text="row.title"></span>
                                    </span>
                                </span>

                                <span class="text-xs text-ink-400" x-show="row.note" x-text="row.note"></span>

                                <span class="app-tree-badge" x-show="row.childCount !== null && row.childCount > 0"
                                      x-text="row.childCount"></span>

                                <span class="text-xs text-red-600" x-show="row.error" x-text="row.error"></span>

                                <a class="text-ink-400 hover:text-brand-600" x-show="row.href" :href="row.href"
                                   :title="TREE.openFile">
                                    <i class="bi bi-box-arrow-up-left text-xs" aria-hidden="true"></i>
                                </a>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>

<script th:inline="javascript">
    /* Attribute bindings cannot use [[...]] inlining, so the copy is handed to Alpine here. */
    const TREE = {
        expand:            [[#{tree.expand}]],
        collapse:          [[#{tree.collapse}]],
        openFile:          [[#{tree.openFile}]],
        loadFailed:        [[#{tree.loadFailed}]],
        notPermitted:      [[#{tree.notPermitted}]],
        searchPlaceholder: [[#{tree.searchPlaceholder}]],
        searchFailed:      [[#{tree.searchFailed}]],
        searchEmpty:       [[#{tree.searchEmpty}]],
        more:              [[#{tree.more}]],
        expandAllCapped:   [[#{tree.expandAllCapped}]]
    };
    // The first page of the top level (roadmap 12.4); "more" asks for the rest.
    const TREE_ROOT_LEVEL = /*[[${rootLevel}]]*/ { nodes: [], page: null };
    const TREE_ROOT_ID = /*[[${rootFolderId}]]*/ 1;

    /** How many rows "expand all" opens before it stops: a tree of a hundred thousand is not drawn whole. */
    const EXPAND_ALL_LIMIT = 2000;
    /** The top level is opened on arrival only when it is this small. */
    const OPEN_ROOTS_UP_TO = 30;

    /** Carries the status through, so a refusal can be told apart from a failure. */
    class TreeRequestError extends Error {
        constructor(status) {
            super("HTTP " + status);
            this.status = status;
        }
    }

    function fileTree() {
        return {
            rows: [],
            loading: false,
            error: "",

            searchQuery: "",
            searchResults: [],
            searching: false,
            searchError: "",
            highlightKey: null,

            async init() {
                this.rows = this.rowsOf(TREE_ROOT_LEVEL, 0, null);
                if (TREE_ROOT_LEVEL.nodes.length <= OPEN_ROOTS_UP_TO) {
                    await this.expandRoots();
                }
            },

            /** A level's rows, and a "more" row after them when the level has another page. */
            rowsOf(level, depth, parent) {
                const rows = level.nodes.map(n => this.decorate(n, depth));
                const page = level.page;
                if (page && page.number < page.totalPages - 1) {
                    rows.push({
                        more: true, depth: depth, loading: false, parent: parent, nextPage: page.number + 1,
                        shown: (page.number + 1) * page.size, total: page.totalElements, type: "MORE",
                        key: "MORE-" + (parent ? parent.key : "root") + "-" + (page.number + 1)
                    });
                }
                return rows;
            },

            /** The next page of a level, in place of its "more" row. */
            async loadMore(row) {
                if (row.loading) {
                    return;
                }
                row.loading = true;
                try {
                    const level = await this.fetchLevel(row.parent ? row.parent.type : "FOLDER",
                        row.parent ? row.parent.id : null, row.nextPage);
                    const present = new Set(this.rows.filter(r => !r.more).map(r => r.type + "-" + r.id));
                    const added = this.rowsOf(level, row.depth, row.parent)
                        .filter(r => r.more || !present.has(r.type + "-" + r.id));
                    const at = this.indexOf(row);
                    this.rows = [...this.rows.slice(0, at), ...added, ...this.rows.slice(at + 1)];
                } catch (e) {
                    row.loading = false;
                }
            },

            /** One page of a level: the children of a node, or of the top when id is null. */
            async fetchLevel(type, id, page) {
                const url = id === null
                    ? "/resource/files/tree/children?type=FOLDER&id=" + encodeURIComponent(TREE_ROOT_ID) + "&page=" + page
                    : "/resource/files/tree/children?type=" + encodeURIComponent(type) + "&id=" + encodeURIComponent(id) + "&page=" + page;
                const response = await fetch(url, {
                    headers: { "Accept": "application/json", "X-Requested-With": "XMLHttpRequest" },
                    credentials: "same-origin"
                });
                if (response.status === 401) {
                    window.appSessionExpired();
                    throw new TreeRequestError(401);
                }
                if (!response.ok) {
                    throw new TreeRequestError(response.status);
                }
                return response.json();
            },

            decorate(node, depth) {
                return Object.assign({}, node, {
                    depth: depth,
                    open: false,
                    loaded: false,
                    loading: false,
                    error: "",
                    key: node.type + "-" + node.id + "-" + depth + "-" + Math.random().toString(36).slice(2, 8)
                });
            },

            /**
             * A node's id is only unique within its own type (a v1 of one file and a v1 of
             * another both carry id=1), so matching on {type, id} alone can resolve to the
             * wrong row once more than one branch is open. `key` is generated once per row in
             * `decorate` and never reused, so it is safe to match on regardless of node type.
             */
            indexOf(row) {
                return this.rows.findIndex(candidate => candidate.key === row.key);
            },

            async toggle(row) {
                if (!row.expandable || row.loading) {
                    return;
                }
                if (row.open) {
                    this.close(row);
                    return;
                }
                await this.open(row);
            },

            async open(row) {
                if (!row.expandable || row.open || row.loading) {
                    return;
                }
                row.open = true;
                // Children are fetched again after a close so the read-only view never shows stale data.
                await this.load(row);
            },

            // Root categories load in parallel rather than one at a time - `load()` always
            // re-resolves its insertion point against the live `rows` array when it resumes,
            // so concurrent loads cannot clobber each other's splice.
            async expandRoots() {
                await Promise.all(this.rows.map(row => this.open(row)));
            },

            /**
             * Opens every folder but stops short of files. A file's versions are metadata the
             * user asks for one file at a time, not something a bulk expand should fetch - on
             * real data a single folder can hold dozens of files, each with its own version list,
             * so also opening every file here turns "expand all" into one HTTP request per file
             * in the whole tree.
             */
            async expandAll() {
                let index = 0;
                this.error = "";
                while (index < this.rows.length) {
                    if (this.rows.length >= EXPAND_ALL_LIMIT) {
                        // A tree of a hundred thousand folders is not drawn whole; the rest is
                        // opened by hand, or found by the search above.
                        this.error = TREE.expandAllCapped.replace("{0}", EXPAND_ALL_LIMIT.toLocaleString("fa-IR"));
                        break;
                    }
                    const row = this.rows[index];
                    if (!row.more && row.type !== "FILE") {
                        await this.open(row);
                    }
                    index++;
                }
            },

            close(row) {
                row.open = false;
                const start = this.indexOf(row) + 1;
                let end = start;
                while (end < this.rows.length && this.rows[end].depth > row.depth) {
                    end++;
                }
                this.rows = [...this.rows.slice(0, start), ...this.rows.slice(end)];
            },

            async load(row) {
                this.loading = true;
                row.loading = true;
                row.error = "";
                try {
                    // The first page of the level; a "more" row brings the rest (roadmap 12.4).
                    const level = await this.fetchLevel(row.type, row.id, 0);
                    const decorated = this.rowsOf(level, row.depth + 1, row);
                    const insertionIndex = this.indexOf(row) + 1;
                    this.rows = [
                        ...this.rows.slice(0, insertionIndex),
                        ...decorated,
                        ...this.rows.slice(insertionIndex)
                    ];
                    row.loaded = true;
                } catch (e) {
                    // Marked on the row itself, not just the page-level banner: with several
                    // branches opening at once (expandRoots, expandAll) a global message alone
                    // does not say which node failed, and a silently re-closed node is
                    // indistinguishable from one that legitimately has nothing under it.
                    //
                    // "You may not" and "it broke" are different answers and used to read the same,
                    // which sent an administrator looking for a bug in the tree when the account was
                    // simply missing REST_GET_FILE_TREE.
                    row.open = false;
                    if (e.status !== 401) {   // issue 77: the session has ended, and that is said
                        row.error = e.status === 403 ? TREE.notPermitted : TREE.loadFailed;
                    }
                } finally {
                    row.loading = false;
                    // Other branches opened by expandRoots/expandAll may still be in flight;
                    // only clear the page-level busy state once none of them are.
                    this.loading = this.rows.some(r => r.loading);
                }
            },

            collapseAll() {
                this.rows = this.rowsOf(TREE_ROOT_LEVEL, 0, null);
                this.error = "";
            },

            async runSearch() {
                const term = this.searchQuery.trim();
                this.searchResults = [];
                this.searchError = "";
                if (!term) {
                    return;
                }
                this.searching = true;
                try {
                    const url = "/resource/files/tree/search?query=" + encodeURIComponent(term);
                    const response = await fetch(url, {
                        headers: { "Accept": "application/json", "X-Requested-With": "XMLHttpRequest" },
                        credentials: "same-origin"
                    });
                    if (response.status === 401) {
                        window.appSessionExpired();   // issue 77: the session has ended
                        return;
                    }
                    if (!response.ok) {
                        throw new TreeRequestError(response.status);
                    }
                    const hits = await response.json();
                    if (hits.length === 0) {
                        this.searchError = TREE.searchEmpty;
                    }
                    this.searchResults = hits;
                } catch (e) {
                    this.searchError = e.status === 403 ? TREE.notPermitted : TREE.searchFailed;
                } finally {
                    this.searching = false;
                }
            },

            /**
             * Opens each folder on the way down in turn (each already present as a row, since the
             * top level loads at init and every level is fetched by the time its child is reached)
             * and stops at the file itself - its versions are not needed to show where it lives.
             * Scrolls the file row into view and flags it for the highlight in app.css.
             */
            /**
             * A node the loaded rows of its level do not hold - it is beyond their first page - put in
             * at the end of that level, before its "more" row: enough to reach it.
             */
            placeRow(node, parent) {
                const depth = parent ? parent.depth + 1 : 0;
                let at = parent ? this.indexOf(parent) + 1 : 0;
                while (at < this.rows.length && this.rows[at].depth >= depth
                       && !(this.rows[at].more && this.rows[at].depth === depth)) {
                    at++;
                }
                const row = this.decorate(node, depth);
                this.rows = [...this.rows.slice(0, at), row, ...this.rows.slice(at)];
                return row;
            },

            async revealHit(hit) {
                this.searchResults = [];

                let parent = null;
                for (let step = 0; step < hit.folderIds.length; step++) {
                    const folderId = hit.folderIds[step];
                    let folder = this.rows.find(r => r.type === "FOLDER" && r.id === folderId);
                    if (!folder) {
                        // Beyond the first page of a wide level: put in where the level's rows end.
                        folder = this.placeRow({ type: "FOLDER", id: folderId, name: hit.folderTitles[step],
                            title: hit.folderTitles[step], icon: "bi-folder-fill", expandable: true, childCount: null }, parent);
                    }
                    if (!folder.open) {
                        await this.open(folder);
                    }
                    parent = folder;
                }

                let file = this.rows.find(r => r.type === "FILE" && r.id === hit.fileId);
                if (!file && parent) {
                    file = this.placeRow({ type: "FILE", id: hit.fileId, name: hit.fileName, title: hit.fileTitle,
                        icon: "bi-file-earmark-text", expandable: true, childCount: null,
                        href: "/files/file-info/" + hit.fileId }, parent);
                }
                if (!file) {
                    return;
                }

                this.highlightKey = file.key;
                await this.$nextTick();
                const rowElement = document.getElementById("tree-row-" + file.key);
                if (rowElement) {
                    rowElement.scrollIntoView({ behavior: "smooth", block: "center" });
                }
                setTimeout(() => {
                    if (this.highlightKey === file.key) {
                        this.highlightKey = null;
                    }
                }, 2500);
            }
        };
    }
</script>
</body>
</html>
