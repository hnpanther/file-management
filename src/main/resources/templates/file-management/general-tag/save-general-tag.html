<!DOCTYPE html>
<html lang="fa" dir="rtl"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <th:block th:replace="~{fragments.html :: head-assets}"></th:block>
    <title th:if="${#strings.equals(pageType, 'create')}" th:text="#{tag.create.pageTitle}">ساخت تگ عمومی</title>
    <title th:if="${#strings.equals(pageType, 'update')}" th:text="#{tag.edit.heading}">ویرایش تگ عمومی</title>
</head>
<body>
<div th:replace="~{navbar.html :: navbar}"></div>

<main class="container-fluid app-content">
    <header class="page-header">
        <div class="page-kicker" th:text="#{generalTag.form.kicker}">طبقه‌بندی کلان</div>
        <h1 th:if="${#strings.equals(pageType, 'create')}" th:text="#{tag.createButton}">ایجاد تگ عمومی جدید</h1>
        <h1 th:if="${#strings.equals(pageType, 'update')}" th:text="#{tag.edit.heading}">ویرایش تگ عمومی</h1>
        <p class="page-description" th:text="#{generalTag.form.description}">اطلاعات تگ عمومی را تکمیل کنید.</p>
    </header>

    <section class="card mx-auto max-w-4xl">
        <div class="card-body">
            <form th:action="@{${#strings.equals(pageType, 'create') ? '/general-tags' : '/general-tags/' + generalTag.getId()}}"
                  method="post" id="generalTagForm" th:object="${generalTag}">
                <input class="generalTagId" th:field="*{id}" type="hidden">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="tagNameDescription" th:text="#{field.tagNameFa}">نام فارسی تگ</label>
                        <input id="tagNameDescription" dir="rtl" type="text" class="form-control"
                               th:field="*{tagNameDescription}" required>
                    </div>
                    <div class="form-group">
                        <label for="tagName" th:text="#{generalTag.nameEnHint}">نام فنی انگلیسی</label>
                        <input id="tagName" dir="ltr" type="text" class="form-control technical"
                               th:field="*{tagName}" required
                               th:readonly="${#strings.equals(pageType, 'update')}">
                    </div>
                </div>

                <div th:if="${showMessage && valid}" class="alert alert-success" role="status"
                     id="success_message" th:text="${message}"></div>
                <div th:if="${showMessage && !valid}" class="alert alert-warning" role="alert"
                     id="warning_message" th:text="${message}"></div>

                <div class="form-actions form-actions-split">
                    <div class="form-action-group">
                        <a th:href="@{/general-tags}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-right" aria-hidden="true"></i>
                            <span th:text="#{action.backToGeneralTags}">بازگشت به فهرست تگ‌های عمومی</span>
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2" aria-hidden="true"></i>
                            <span th:text="#{action.save}">ذخیره</span>
                        </button>
                    </div>
                    <button th:if="${#strings.equals(pageType, 'update')}"
                            sec:authorize="hasAuthority('REST_DELETE_GENERAL_TAG') || hasAuthority('ADMIN')"
                            type="button" onclick="deleteTag()" class="btn btn-danger">
                        <i class="bi bi-trash3" aria-hidden="true"></i>
                        <span th:text="#{action.delete}">حذف</span>
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments.html :: scripts}"></th:block>
<script th:inline="javascript">
    function deleteTag() {
        if (!confirm([[#{js.confirmDelete}]])) {
            return;
        }
        const csrf = window.appCsrf();
        const headers = {};
        if (csrf.header && csrf.token) {
            headers[csrf.header] = csrf.token;
        }
        $.ajax({
            url: [[@{/resource/general-tags/}]] + $(".generalTagId").val(),
            type: "DELETE",
            dataType: "json",
            contentType: "application/json; charset=utf-8",
            headers: headers,
            complete: function (xhr) {
                if (xhr.status === 200) {
                    alert([[#{js.deleted}]]);
                    window.location.replace([[@{/general-tags}]]);
                } else {
                    alert([[#{js.cannotDeleteCategory}]]);
                }
            }
        });
    }
</script>
</body>
</html>
