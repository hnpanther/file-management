spring.profiles.active=dev

# This file shadows src/main/resources/application.properties rather than adding to it - same
# classpath name, and the test one comes first - so anything the suite has to exercise from the
# shipped configuration must be imported here explicitly. The health and info settings are the
# first block that mattered: without this line the tests asserted Spring Boot's defaults and would
# not have noticed the real configuration being wrong.
spring.config.import=classpath:management.properties,classpath:openapi.properties

server.error.include-stacktrace=NEVER

# The datasource is supplied at runtime by DatabaseSupport, which starts a Testcontainers PostgreSQL
# and registers spring.datasource.* through @DynamicPropertySource. Do not hardcode a connection here:
# the suite must run on any machine with a Docker daemon and nothing else.

#jpa and hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
# As in the main configuration.
spring.flyway.locations=classpath:db/migration

# Storage root for the tests. Relative to the project directory, inside target/ so that `mvn clean`
# removes it. StorageRootSupport clears it before and after every test; the tests themselves create
# it in their own @BeforeEach, so it must not exist when a test starts.
# The trailing slash matters - FileStorageFileSystemService concatenates rather than resolves.
file.management.base-dir=./target/test-storage/
# The same root under this application's own prefix, as src/main's application.properties does:
# the test resources replace that file rather than adding to it, so both spellings are set here too.
filemanagement.base-dir=${file.management.base-dir}

# The reference-data bootstrap only runs on the prod profile, so the suite runs with it off and the
# tests that need permissions or the fixed roles call DataInitializer themselves - it is idempotent.
# A password is configured so those runs do not generate a random one and log it every time.
filemanagement.bootstrap.admin-password=test-only-password

# The checksum backfill (ChecksumBackfill) would otherwise start on a thread of its own in every
# test context and write to rows a test is looking at; ChecksumBackfillTest runs it by hand.
filemanagement.storage.checksum-backfill-enabled=false
